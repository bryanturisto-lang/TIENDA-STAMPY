<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envíos — Estampy interno</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/estampy-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
<style>
  .tablero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .col-t { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; }
  .col-t-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px; }
  .col-t-head strong { font-size: .84rem; color: var(--brand-deep); }
  .col-t-head .n { margin-left: auto; background: var(--gray-100); color: var(--gray-600); font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
  .col-t-body { padding: 12px; display: grid; gap: 10px; min-height: 90px; max-height: 460px; overflow-y: auto; }
  .tarjeta-env { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--gray-50); transition: all .18s var(--ease); cursor: pointer; }
  .tarjeta-env:hover { border-color: var(--blue-300); background: #fff; box-shadow: var(--shadow-sm); }
  .tarjeta-env.tarde { border-left: 3px solid var(--red-600); }
  @media (max-width: 1100px) { .tablero { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px) { .tablero { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="adm-page" class="hidden">
  <div class="kpis" id="resumen" style="margin-bottom:20px"></div>

  <div class="box">
    <div class="box-head">
      <div><h2>Tablero del taller</h2><p>Del diseño a la entrega: mueve cada pedido con el botón de su tarjeta. Las que tienen borde rojo van con retraso.</p></div>
      <button class="btn btn-ghost btn-sm" type="button" id="btnCSV"></button>
    </div>
    <div class="box-body"><div class="tablero" id="tablero"></div></div>
  </div>

  <div class="box">
    <div class="box-head">
      <div><h2>Envíos a domicilio</h2><p>Asigna courier, guía y repartidor</p></div>
      <div class="adm-search" style="max-width:280px">
        <span id="icBuscar"></span>
        <input id="buscar" type="search" placeholder="Buscar pedido, ciudad o guía…">
      </div>
    </div>
    <div class="box-body tight"><div class="tabla-wrap" id="tablaDelivery"></div></div>
  </div>

  <div class="box">
    <div class="box-head"><div><h2>Retiros en el taller</h2><p>Pedidos que el cliente pasa a buscar</p></div></div>
    <div class="box-body tight"><div class="tabla-wrap" id="tablaTienda"></div></div>
  </div>

  <div class="box">
    <div class="box-head"><div><h2>Carga por zona</h2><p>Pedidos activos según destino</p></div></div>
    <div class="box-body" id="porZona"></div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/mockup.js"></script>
<script src="../assets/js/app.js"></script>
<script src="admin.js"></script>
<script>
(async function () {
  const A = window.STAMPY;
  if (!(await ADM.iniciar("envios", "Envíos y entregas", "Produce, despacha y cierra las entregas del día"))) return;

  const $ = (id) => document.getElementById(id);
  $("icBuscar").innerHTML = A.icon("search");
  $("btnCSV").innerHTML = A.icon("download") + " Hoja de ruta";

  let filtro = "";
  $("buscar").addEventListener("input", (e) => { filtro = e.target.value.toLowerCase(); pintarTablas(); });

  const activos = () => A.orders.activos().filter((o) => o.pagoEstado === "verificado" || o.estadoIndex >= 1);
  const tarde = (o) => o.estadoIndex < 5 && new Date(o.eta) < new Date();

  /* Índices: 1 pago verificado · 2 diseño aprobado · 3 en producción · 4 despachado / listo para retirar */
  const COLUMNAS = [
    { idx: 1, titulo: "Esperando diseño", icono: "sparkle" },
    { idx: 2, titulo: "Por producir", icono: "box" },
    { idx: 3, titulo: "En producción", icono: "print" },
    { idx: 4, titulo: "Despachados / por retirar", icono: "truck" },
  ];

  /* ==================== Resumen ==================== */
  function pintarResumen() {
    const act = activos().filter((o) => o.estadoIndex >= 1 && o.estadoIndex < 5);
    const atrasados = act.filter(tarde);
    const hoy = ADM.diaISO(new Date());
    const entregadosHoy = A.orders.activos().filter((o) => {
      const h = o.historial[o.historial.length - 1];
      return o.estadoIndex === 5 && h && ADM.diaISO(h.fecha) === hoy;
    });
    const unidades = act.reduce((s, o) => s + ADM.piezas(o), 0);
    const enTaller = act.filter((o) => o.estadoIndex >= 2 && o.estadoIndex <= 3);

    const items = [
      ["truck", "", "Pedidos en curso", act.length, `${unidades} pieza(s) entre taller y calle`, ""],
      ["print", enTaller.length ? "amber" : "", "En el taller", enTaller.length, `${enTaller.reduce((s, o) => s + ADM.piezas(o), 0)} pieza(s) por producir o en plancha`, ""],
      ["clock", atrasados.length ? "red" : "green", "Con retraso", atrasados.length, atrasados.length ? "Pasaron su fecha estimada" : "Todo dentro de plazo", atrasados.length ? "critico" : ""],
      ["checkCircle", "green", "Entregados hoy", entregadosHoy.length, A.fmtUSD(entregadosHoy.reduce((t, o) => t + o.totales.total, 0)), ""],
    ];
    $("resumen").innerHTML = items
      .map(([ic, col, dt, dd, sub, cls]) => `<div class="kpi ${cls}">
        <div class="kpi-ic ${col}">${A.icon(ic)}</div><dt>${dt}</dt><dd>${dd}</dd><span class="sub">${sub}</span></div>`)
      .join("");
  }

  /* ==================== Tablero ==================== */
  function pintarTablero() {
    $("tablero").innerHTML = COLUMNAS.map((c) => {
      const lista = activos().filter((o) => o.estadoIndex === c.idx);
      return `<div class="col-t">
        <div class="col-t-head">
          <span style="color:var(--brand)">${A.icon(c.icono, "icon-16")}</span>
          <strong>${c.titulo}</strong>
          <span class="n">${lista.length}</span>
        </div>
        <div class="col-t-body">
          ${lista.length
            ? lista.map((o) => {
                const pasos = A.orders.pasosDe(o);
                return `<div class="tarjeta-env ${tarde(o) ? "tarde" : ""}" onclick="detalle('${o.codigo}')">
                  <div class="row-between" style="gap:8px">
                    <span class="mono" style="font-size:.76rem;font-weight:800;color:var(--brand-deep)">${o.codigo}</span>
                    <span class="tiny muted">${ADM.hace(o.creado)}</span>
                  </div>
                  <div style="font-size:.83rem;color:var(--gray-700);margin-top:4px">${A.escape(o.cliente.nombre)}</div>
                  <div class="tiny muted">${o.entrega.modo === "tienda" ? "Retiro · " + A.escape(o.entrega.tiendaNombre || "") : A.escape(o.entrega.ciudad || "")}</div>
                  <div class="tiny" style="color:var(--gray-700);margin-top:4px">${A.escape(ADM.resumenPedido(o))}</div>
                  ${c.idx <= 3 ? `<div class="tiny logo-estado ${ADM.estadoLogo(o).clase}" style="margin-top:2px">${A.escape(ADM.estadoLogo(o).texto)}</div>` : ""}
                  <div class="row-between" style="margin-top:8px">
                    <span class="tiny" style="color:${tarde(o) ? "var(--red-600)" : "var(--ink-muted)"};font-weight:${tarde(o) ? 700 : 400}">
                      ${tarde(o) ? "Venció " : "Para "}${A.fmtFecha(o.eta)}
                    </span>
                    <span class="row" style="gap:4px">
                      ${c.idx >= 2 && c.idx <= 3 ? `<button class="tbtn" type="button" title="Hoja de producción" onclick="event.stopPropagation();ADM.verHojas([STAMPY.orders.find('${o.codigo}')])">${A.icon("print")}</button>` : ""}
                      <button class="btn btn-soft btn-sm" style="padding:4px 10px;font-size:.72rem" type="button"
                              onclick="event.stopPropagation();avanzar('${o.codigo}')">${pasos[c.idx + 1].titulo} →</button>
                    </span>
                  </div>
                </div>`;
              }).join("")
            : `<p class="tiny muted center" style="padding:14px 0">Sin pedidos aquí</p>`}
        </div>
      </div>`;
    }).join("");
  }

  window.avanzar = function (codigo) {
    A.orders.avanzar(codigo);
    recargar("Pedido movido al siguiente estado");
  };

  /* ==================== Tablas ==================== */
  function coincide(o) {
    if (!filtro) return true;
    return (o.codigo + " " + o.cliente.nombre + " " + (o.entrega.ciudad || "") + " " + (o.entrega.tiendaNombre || "") +
      " " + (o.guia || "") + " " + (o.courier || "") + " " + (o.repartidor ? o.repartidor.nombre : "")).toLowerCase().includes(filtro);
  }

  function pintarTablas() {
    const delivery = activos().filter((o) => o.entrega.modo === "delivery" && o.estadoIndex >= 1 && o.estadoIndex < 5 && coincide(o));
    $("tablaDelivery").innerHTML = delivery.length
      ? `<table class="tabla">
        <thead><tr><th>Pedido</th><th>Destino</th><th>Courier / guía</th><th>Repartidor</th><th>Estado</th><th>Entrega</th><th class="acciones">Acciones</th></tr></thead>
        <tbody>${delivery.map((o) => `<tr>
          <td><span class="principal mono" style="font-size:.8rem">${o.codigo}</span><div class="sec">${A.escape(o.cliente.nombre)}</div></td>
          <td class="small">${A.escape(o.entrega.ciudad || "")}<div class="sec">${A.escape((o.entrega.zonaNombre || "").split("(")[0].trim())}</div></td>
          <td class="small">${A.escape(o.courier || "—")}<div class="sec mono">${A.escape(o.guia || "sin guía")}</div></td>
          <td class="small">${o.repartidor ? A.escape(o.repartidor.nombre) + `<div class="sec">${A.escape(o.repartidor.telefono)}</div>` : '<span class="muted">Sin asignar</span>'}</td>
          <td>${ADM.estadoBadge(o)}</td>
          <td class="small ${tarde(o) ? "" : "muted"}" style="${tarde(o) ? "color:var(--red-600);font-weight:700" : ""}">${A.fmtFecha(o.eta)}</td>
          <td class="acciones">
            <button class="tbtn" type="button" onclick="asignar('${o.codigo}')" title="Asignar envío">${A.icon("edit")}</button>
            <button class="tbtn good" type="button" onclick="avanzar('${o.codigo}')" title="Avanzar estado">${A.icon("arrowRight")}</button>
            <a class="tbtn" href="pedidos.html?codigo=${o.codigo}" title="Ver pedido">${A.icon("eye")}</a>
          </td>
        </tr>`).join("")}</tbody></table>`
      : ADM.vacio("truck", "Nada en tránsito", "No hay envíos a domicilio activos ahora mismo.");

    const tienda = activos().filter((o) => o.entrega.modo === "tienda" && o.estadoIndex >= 1 && o.estadoIndex < 5 && coincide(o));
    $("tablaTienda").innerHTML = tienda.length
      ? `<table class="tabla">
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Tienda</th><th>Estado</th><th>Listo para</th><th class="acciones">Acciones</th></tr></thead>
        <tbody>${tienda.map((o) => `<tr>
          <td><span class="principal mono" style="font-size:.8rem">${o.codigo}</span><div class="sec">${ADM.piezas(o)} pieza(s)</div></td>
          <td>${A.escape(o.cliente.nombre)}<div class="sec">${A.escape(o.cliente.telefono)}</div></td>
          <td class="small">${A.escape(o.entrega.tiendaNombre || "")}</td>
          <td>${ADM.estadoBadge(o)}</td>
          <td class="small muted">${A.fmtFecha(o.eta)}</td>
          <td class="acciones">
            <button class="tbtn good" type="button" onclick="avanzar('${o.codigo}')" title="Avanzar estado">${A.icon("arrowRight")}</button>
            <a class="tbtn" href="pedidos.html?codigo=${o.codigo}" title="Ver pedido">${A.icon("eye")}</a>
          </td>
        </tr>`).join("")}</tbody></table>`
      : ADM.vacio("store", "Sin retiros pendientes", "No hay pedidos esperando ser retirados en el taller.");
  }

  /* ==================== Asignar envío ==================== */
  window.asignar = function (codigo) {
    const o = A.orders.find(codigo);
    ADM.modal({
      titulo: "Datos de envío · " + codigo,
      subtitulo: `${A.escape(o.cliente.nombre)} · ${A.escape(o.entrega.ciudad || "")}`,
      cuerpo: `
        <div class="notice notice-blue" style="margin-bottom:18px">${A.icon("pin")}
          <span>${A.escape(o.entrega.direccion)}${o.entrega.referencia ? " · " + A.escape(o.entrega.referencia) : ""}</span></div>
        <div class="grid-2" style="gap:16px">
          <div class="field">
            <label for="asCourier">Courier</label>
            <select class="select" id="asCourier">
              ${A.config.courier.map((c) => `<option${o.courier === c ? " selected" : ""}>${c}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label for="asGuia">Número de guía</label>
            <input class="input mono" id="asGuia" value="${A.escape(o.guia || "")}">
          </div>
          <div class="field">
            <label for="asRepartidor">Repartidor</label>
            <input class="input" id="asRepartidor" value="${A.escape(o.repartidor ? o.repartidor.nombre : "")}" placeholder="Nombre y apellido">
          </div>
          <div class="field">
            <label for="asTelefono">Teléfono del repartidor</label>
            <input class="input" id="asTelefono" value="${A.escape(o.repartidor ? o.repartidor.telefono : "")}" placeholder="0414-1234567">
          </div>
          <div class="field">
            <label for="asVehiculo">Vehículo</label>
            <select class="select" id="asVehiculo">
              ${["Moto", "Camioneta", "Furgón"].map((v) => `<option${o.repartidor && o.repartidor.vehiculo === v ? " selected" : ""}>${v}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label for="asEta">Fecha estimada de entrega</label>
            <input class="input" id="asEta" type="date" value="${o.eta.slice(0, 10)}">
          </div>
        </div>`,
      pie: `<button class="btn btn-ghost" type="button" onclick="ADM.cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" type="button" id="okAsignar">${A.icon("save")} Guardar</button>`,
      alAbrir: (bg) => {
        bg.querySelector("#okAsignar").onclick = () => {
          const nombre = bg.querySelector("#asRepartidor").value.trim();
          A.orders.actualizarEnvio(codigo, {
            courier: bg.querySelector("#asCourier").value,
            guia: bg.querySelector("#asGuia").value.trim(),
            repartidor: nombre
              ? { nombre, telefono: bg.querySelector("#asTelefono").value.trim(), vehiculo: bg.querySelector("#asVehiculo").value }
              : null,
            eta: new Date(bg.querySelector("#asEta").value + "T12:00:00").toISOString(),
          });
          ADM.cerrarModal();
          recargar("Datos de envío guardados");
        };
      },
    });
  };

  /* ==================== Detalle rápido ==================== */
  window.detalle = function (codigo) {
    const o = A.orders.find(codigo);
    const pasos = A.orders.pasosDe(o);
    ADM.detalle(
      `<div><span class="mono" style="font-size:1.1rem;font-weight:800;color:var(--brand-deep)">${o.codigo}</span>
        <div style="margin-top:6px">${ADM.estadoBadge(o)}</div></div>`,
      `<div class="det-sec">
        <h4>Entrega</h4>
        <dl class="dl">
          <div class="dl-row"><dt>Cliente</dt><dd>${A.escape(o.cliente.nombre)}</dd></div>
          <div class="dl-row"><dt>Teléfono</dt><dd>${A.escape(o.cliente.telefono)}</dd></div>
          <div class="dl-row"><dt>${o.entrega.modo === "tienda" ? "Tienda" : "Dirección"}</dt><dd>${A.escape(o.entrega.modo === "tienda" ? o.entrega.tiendaNombre : o.entrega.direccion)}</dd></div>
          ${o.entrega.referencia ? `<div class="dl-row"><dt>Referencia</dt><dd>${A.escape(o.entrega.referencia)}</dd></div>` : ""}
          ${o.entrega.nota ? `<div class="dl-row"><dt>Nota</dt><dd>${A.escape(o.entrega.nota)}</dd></div>` : ""}
          ${o.courier ? `<div class="dl-row"><dt>Courier</dt><dd>${A.escape(o.courier)}</dd></div>` : ""}
          ${o.guia ? `<div class="dl-row"><dt>Guía</dt><dd class="mono">${A.escape(o.guia)}</dd></div>` : ""}
          ${o.repartidor ? `<div class="dl-row"><dt>Repartidor</dt><dd>${A.escape(o.repartidor.nombre)} · ${A.escape(o.repartidor.telefono)}</dd></div>` : ""}
          <div class="dl-row"><dt>Fecha estimada</dt><dd>${A.fmtFecha(o.eta)}</dd></div>
        </dl>
      </div>
      <div class="det-sec">
        <h4>Contenido · ${ADM.piezas(o)} piezas</h4>
        ${ADM.lineasHTML(o.items, { sinPrecio: true })}
      </div>
      <div class="det-sec">
        <h4>Avance</h4>
        <div class="timeline-mini">
          ${pasos.map((p, i) => {
            const h = o.historial.find((x) => x.paso === p.id);
            return `<div class="tm-item ${i <= o.estadoIndex ? "on" : ""}"><strong>${p.titulo}</strong>
              <span>${h ? A.fmtFechaHora(h.fecha) : "Pendiente"}</span></div>`;
          }).join("")}
        </div>
      </div>`,
      `${o.entrega.modo === "delivery" ? `<button class="btn btn-ghost btn-sm" type="button" onclick="ADM.cerrarDetalle();asignar('${o.codigo}')">${A.icon("edit")} Asignar envío</button>` : ""}
       <button class="btn btn-ghost btn-sm" type="button" onclick="ADM.verHojas([STAMPY.orders.find('${o.codigo}')])">${A.icon("print")} Hoja de producción</button>
       <a class="btn btn-ghost btn-sm" href="pedidos.html?codigo=${o.codigo}">Ver pedido</a>
       ${o.estadoIndex < pasos.length - 1 ? `<button class="btn btn-primary btn-sm grow" type="button" onclick="ADM.cerrarDetalle();avanzar('${o.codigo}')">${A.icon("arrowRight")} ${pasos[o.estadoIndex + 1].titulo}</button>` : ""}`
    );
  };

  /* ==================== Carga por zona ==================== */
  function pintarZonas() {
    const act = activos().filter((o) => o.estadoIndex >= 1 && o.estadoIndex < 5);
    const filas = A.config.zonas.map((z) => {
      const n = act.filter((o) => o.entrega.zonaId === z.id).length;
      return { etiqueta: z.nombre.split("(")[0].trim(), valor: n, texto: `${n} pedido(s) · ${z.dias} ${z.dias === 1 ? "día" : "días"}` };
    });
    const retiros = act.filter((o) => o.entrega.modo === "tienda").length;
    filas.push({ etiqueta: "Retiro en tienda", valor: retiros, texto: `${retiros} pedido(s)`, color: "g" });
    $("porZona").innerHTML = ADM.barrasH(filas);
  }

  /* ==================== Hoja de ruta ==================== */
  $("btnCSV").onclick = () => {
    const lista = activos().filter((o) => o.estadoIndex >= 1 && o.estadoIndex < 5);
    ADM.exportarCSV(
      "hoja-de-ruta",
      ["Pedido", "Cliente", "Telefono", "Tipo", "Direccion", "Ciudad", "Referencia", "Contenido (talla y color)", "Piezas", "Courier", "Guia", "Repartidor", "Estado", "Fecha estimada"],
      lista.map((o) => [
        o.codigo, o.cliente.nombre, o.cliente.telefono,
        o.entrega.modo === "tienda" ? "Retiro" : "Delivery",
        o.entrega.modo === "tienda" ? o.entrega.tiendaNombre : o.entrega.direccion,
        o.entrega.ciudad || "", o.entrega.referencia || "",
        ADM.resumenPedido(o), ADM.piezas(o),
        o.courier || "", o.guia || "", o.repartidor ? o.repartidor.nombre : "",
        A.orders.pasosDe(o)[o.estadoIndex].titulo, A.fmtFecha(o.eta),
      ])
    );
  };

  function recargar(mensaje) {
    pintarResumen(); pintarTablero(); pintarTablas(); pintarZonas();
    if (mensaje) A.toast(mensaje, "truck");
  }

  recargar();
})();
</script>
</body>
</html>
