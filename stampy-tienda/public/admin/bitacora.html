<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad — Estampy interno</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/estampy-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="adm-page" class="hidden">
  <div class="kpis" id="resumen" style="margin-bottom:20px"></div>

  <div class="adm-tools">
    <div class="adm-search">
      <span id="icBuscar"></span>
      <input id="buscar" type="search" placeholder="Buscar en la actividad…">
    </div>
    <div class="seg" id="filtroTipo"></div>
    <select class="sort-select" id="filtroUsuario"></select>
  </div>

  <div class="box">
    <div class="box-head">
      <div><h2>Registro de actividad</h2><p id="contador"></p></div>
      <div class="row" style="gap:8px">
        <button class="btn btn-ghost btn-sm" type="button" id="btnCSV"></button>
        <button class="btn btn-ghost btn-sm" type="button" id="btnLimpiar" style="color:var(--red-600);border-color:var(--red-100)"></button>
      </div>
    </div>
    <div class="box-body tight"><div class="tabla-wrap" id="tabla"></div></div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/mockup.js"></script>
<script src="../assets/js/app.js"></script>
<script src="admin.js"></script>
<script>
(async function () {
  const A = window.STAMPY;
  if (!(await ADM.iniciar("bitacora", "Actividad del equipo", "Quién hizo qué y cuándo"))) return;

  const $ = (id) => document.getElementById(id);
  $("icBuscar").innerHTML = A.icon("search");
  $("btnCSV").innerHTML = A.icon("download") + " Exportar";
  $("btnLimpiar").innerHTML = A.icon("trash") + " Vaciar registro";

  const TIPOS = [
    { id: "todo", label: "Todo", test: () => true },
    { id: "pedidos", label: "Pedidos", test: (b) => b.accion.startsWith("pedido") || b.accion.startsWith("estado") || b.accion === "nota-agregada" },
    { id: "pagos", label: "Pagos", test: (b) => b.accion.startsWith("pago") },
    { id: "inventario", label: "Inventario", test: (b) => b.accion.startsWith("modelo") || b.accion.startsWith("stock") || b.accion === "catalogo-restaurado" },
    { id: "envios", label: "Envíos", test: (b) => b.accion === "envio-actualizado" },
    { id: "config", label: "Configuración", test: (b) => b.accion.startsWith("config") },
    { id: "sesion", label: "Sesiones", test: (b) => b.accion.startsWith("sesion") },
  ];

  const ICONOS = {
    "pedido-creado": ["receipt", ""], "pedido-cancelado": ["xCircle", "red"], "pedido-reactivado": ["refresh", ""],
    "pago-verificado": ["checkCircle", "green"], "pago-rechazado": ["xCircle", "red"],
    "estado-avanzado": ["arrowRight", ""], "estado-cambiado": ["edit", ""], "estado-reiniciado": ["refresh", ""],
    "stock-ajustado": ["box", "amber"], "modelo-creado": ["plusCircle", "green"], "modelo-editado": ["edit", ""],
    "modelo-eliminado": ["trash", "red"], "modelo-duplicado": ["copyDoc", ""], "catalogo-restaurado": ["refresh", "amber"],
    "envio-actualizado": ["truck", ""], "nota-agregada": ["edit", ""],
    "sesion-iniciada": ["user", "green"], "sesion-cerrada": ["user", ""],
    "config-tasa": ["settings", "amber"], "config-pagos": ["card", "amber"], "config-zona": ["pin", ""],
    "config-tienda": ["store", ""], "config-contacto": ["phone", ""], "config-restaurada": ["refresh", "amber"],
    "pedidos-borrados": ["trash", "red"], "config-disenos": ["upload", ""], "bitacora-limpiada": ["trash", ""],
  };

  let texto = "", tipo = "todo", usuario = "todos";

  function todos() { return A.bitacora.all(); }

  function pintarFiltros() {
    const t = todos();
    $("filtroTipo").innerHTML = TIPOS.map(
      (x) => `<button type="button" data-t="${x.id}" class="${x.id === tipo ? "is-active" : ""}">${x.label}<span class="n">${t.filter(x.test).length}</span></button>`
    ).join("");

    const usuarios = [...new Set(t.map((b) => b.usuario))];
    $("filtroUsuario").innerHTML =
      `<option value="todos">Todo el equipo</option>` + usuarios.map((u) => `<option${u === usuario ? " selected" : ""}>${A.escape(u)}</option>`).join("");
  }

  $("filtroTipo").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-t]");
    if (!b) return;
    tipo = b.dataset.t; pintarFiltros(); pintar();
  });
  $("buscar").addEventListener("input", (e) => { texto = e.target.value.toLowerCase(); pintar(); });
  $("filtroUsuario").addEventListener("change", (e) => { usuario = e.target.value; pintar(); });

  function filtrados() {
    const t = TIPOS.find((x) => x.id === tipo);
    let l = todos().filter(t.test);
    if (usuario !== "todos") l = l.filter((b) => b.usuario === usuario);
    if (texto) l = l.filter((b) => (b.detalle + " " + b.accion + " " + b.usuario).toLowerCase().includes(texto));
    return l;
  }

  function pintarResumen() {
    const t = todos();
    const hoy = ADM.diaISO(new Date());
    const deHoy = t.filter((b) => ADM.diaISO(b.fecha) === hoy);
    const usuarios = [...new Set(t.map((b) => b.usuario))];
    $("resumen").innerHTML = [
      ["clock", "", "Eventos registrados", t.length, "Se conservan los últimos 400"],
      ["chart", "", "Movimientos de hoy", deHoy.length, deHoy.length ? "Actividad del día" : "Sin movimientos aún"],
      ["users", "", "Personas activas", usuarios.length, usuarios.slice(0, 3).join(", ") || "—"],
      ["checkCircle", "green", "Pagos verificados", t.filter((b) => b.accion === "pago-verificado").length, "Desde el panel"],
    ]
      .map(([ic, col, dt, dd, sub]) => `<div class="kpi">
        <div class="kpi-ic ${col}">${A.icon(ic)}</div><dt>${dt}</dt><dd>${dd}</dd><span class="sub">${sub}</span></div>`)
      .join("");
  }

  function pintar() {
    const l = filtrados();
    $("contador").textContent = `${l.length} ${l.length === 1 ? "evento" : "eventos"} en pantalla`;

    $("tabla").innerHTML = l.length
      ? `<table class="tabla">
        <thead><tr><th style="width:44px"></th><th>Qué pasó</th><th>Quién</th><th>Cuándo</th><th>Referencia</th></tr></thead>
        <tbody>${l.slice(0, 200).map((b) => {
          const [ic, col] = ICONOS[b.accion] || ["info", ""];
          return `<tr>
            <td><span class="kpi-ic ${col}" style="margin:0;width:30px;height:30px">${A.icon(ic, "icon-16")}</span></td>
            <td><span class="principal">${A.escape(b.detalle)}</span><div class="sec mono" style="font-size:.7rem">${b.accion}</div></td>
            <td class="small">${A.escape(b.usuario)}<div class="sec">${ADM.rolNombre[b.rol] || b.rol}</div></td>
            <td class="small muted">${ADM.hace(b.fecha)}<div class="sec">${A.fmtFechaHora(b.fecha)}</div></td>
            <td class="small">${b.ref
              ? (/^EST-/.test(b.ref)
                  ? `<a class="mono" style="color:var(--brand)" href="pedidos.html?codigo=${b.ref}">${b.ref}</a>`
                  : `<a class="mono" style="color:var(--brand)" href="inventario.html">${A.escape(b.ref)}</a>`)
              : "—"}</td>
          </tr>`;
        }).join("")}</tbody></table>`
      : ADM.vacio("clock", "Sin actividad", "Todavía no hay eventos que coincidan con el filtro.");
  }

  $("btnCSV").onclick = () =>
    ADM.exportarCSV(
      "actividad-estampy",
      ["Fecha", "Usuario", "Perfil", "Accion", "Detalle", "Referencia"],
      filtrados().map((b) => [A.fmtFechaHora(b.fecha), b.usuario, ADM.rolNombre[b.rol] || b.rol, b.accion, b.detalle, b.ref || ""])
    );

  $("btnLimpiar").onclick = () =>
    ADM.confirmar("Vaciar el registro", "Se borran los " + todos().length + " eventos guardados. Los pedidos y el inventario no se tocan.", () => {
      A.bitacora.limpiar();
      A.bitacora.add("bitacora-limpiada", "Se vació el registro de actividad");
      pintarResumen(); pintarFiltros(); pintar();
      A.toast("Registro vaciado", "trash");
    }, "Vaciar", true);

  pintarResumen();
  pintarFiltros();
  pintar();
})();
</script>
</body>
</html>
