<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario — Estampy interno</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/estampy-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="adm-page" class="hidden">
  <div class="kpis" id="resumen" style="margin-bottom:20px"></div>

  <div class="adm-tools">
    <div class="adm-search">
      <span id="icBuscar"></span>
      <input id="buscar" type="search" placeholder="Buscar producto, línea, material o talla…">
    </div>
    <div class="seg" id="filtroCat"></div>
    <select class="sort-select" id="orden">
      <option value="nombre">Nombre A–Z</option>
      <option value="stock-asc">Menos stock primero</option>
      <option value="stock-desc">Más stock primero</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="vendidos">Más vendidos</option>
    </select>
  </div>

  <div class="box">
    <div class="box-head">
      <div><h2>Catálogo</h2><p id="contador"></p></div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" type="button" id="btnCSV"></button>
        <button class="btn btn-ghost btn-sm" type="button" id="btnRestaurar"></button>
        <button class="btn btn-primary btn-sm" type="button" id="btnNuevo"></button>
      </div>
    </div>
    <div class="box-body tight"><div class="tabla-wrap" id="tabla"></div></div>
  </div>

  <div class="box">
    <div class="box-head"><div><h2>Movimientos recientes de inventario</h2><p>Altas, bajas y ajustes registrados por el equipo</p></div></div>
    <div class="box-body" id="movimientos"></div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/mockup.js"></script>
<script src="../assets/js/app.js"></script>
<script src="admin.js"></script>
<script>
(async function () {
  const A = window.STAMPY;
  if (!(await ADM.iniciar("inventario", "Inventario", "Productos, tallas, colores, precios al mayor y stock"))) return;

  const $ = (id) => document.getElementById(id);
  $("icBuscar").innerHTML = A.icon("search");
  $("btnCSV").innerHTML = A.icon("download") + " Exportar CSV";
  $("btnRestaurar").innerHTML = A.icon("refresh") + " Restaurar catálogo";
  $("btnNuevo").innerHTML = A.icon("plusCircle") + " Nuevo producto";

  const F = { texto: "", cat: "todas", orden: "nombre" };

  const CATEGORIAS = [
    ["franelas", "Franelas"], ["deportiva", "Deportiva"], ["chemises", "Chemises"],
    ["ninos", "Niños"], ["accesorios", "Accesorios"], ["hogar", "Hogar y regalos"],
  ];

  const CATS = () => {
    const set = {};
    CATEGORIAS.forEach(([id, lb]) => { if (A.products.some((p) => p.categoria === id)) set[id] = lb; });
    A.products.forEach((p) => { if (!set[p.categoria]) set[p.categoria] = p.categoriaLabel || p.categoria; });
    return [{ id: "todas", label: "Todas" }].concat(Object.entries(set).map(([id, label]) => ({ id, label })));
  };

  const totalFinito = (p) => (A.bajoPedido(p) ? 0 : A.stockTotal(p));

  /* ==================== Prendas y objetos (simulador de logo, mockup.js) ==================== */
  const MK = A.mockup || null;
  const ZONAS = MK ? MK.ORDEN.slice() : ["frente", "espalda", "manga-izq", "manga-der"];
  // Zonas posibles de un tipo (prendas: frente, espalda y mangas; taza/cojín: 2 lados o caras; gorra/mousepad: 1)
  const zonasTipo = (t) => (MK && t ? MK.zonasDe(t) : ZONAS.slice());
  const zonaLabel = (t, z, corto) => (MK ? MK.etiqueta(t, z, corto) : z);
  const esObjetoTipo = (t) => !!(MK && t && MK.esObjeto({ tipo: t }));
  const tipoCorto = (t) => String((MK && MK.TIPOS[t]) || t).split(" (")[0];
  const esRefMockup = (x) => !!(MK && MK.esRef(x));
  const esRefObjeto = (x) => typeof x === "string" && x.indexOf("objeto:") === 0;
  // Ilustraciones de antes del simulador (archivos .svg locales de assets/img/productos)
  const esIlustracion = (x) => typeof x === "string" && !esRefMockup(x) && !/^(https?:|data:|blob:)/i.test(x) && /\.svg(\?|#|$)/i.test(x);
  const esPrendaP = (p) => !!(MK && MK.prendaDe(p));
  // Colores de tela de las prendas (el cliente elige uno)
  const PALETA_PRENDA = [
    { nombre: "Blanco", hex: "#FFFFFF" }, { nombre: "Negro", hex: "#1E1E20" },
    { nombre: "Rojo", hex: "#B0232A" }, { nombre: "Azul", hex: "#1F3F8F" },
  ];

  /** Badge "Prenda · Franela · cuello V" (u "Objeto · Taza") y las zonas donde puede ir el logo. */
  function prendaInfoHTML(p) {
    const pr = MK && MK.prendaDe(p);
    if (!pr) return "";
    const zonas = MK.vistasDe(p);
    const extra = [pr.cuello === "v" ? "cuello V" : "", pr.infantil ? "niño" : ""].filter(Boolean);
    return `<div class="prenda-info">
      <span class="badge badge-prenda">${esObjetoTipo(pr.tipo) ? "Objeto" : "Prenda"} · ${A.escape([tipoCorto(pr.tipo)].concat(extra).join(" · "))}</span>
      <span class="zonas-mini" aria-label="Dónde puede ir el logo">${zonasTipo(pr.tipo).map((z) => {
        const on = zonas.includes(z);
        return `<i class="${on ? "on" : ""}" title="${on ? "Logo permitido" : "Sin logo"}: ${A.escape(zonaLabel(pr.tipo, z))}">${A.escape(zonaLabel(pr.tipo, z, true))}</i>`;
      }).join("")}</span>
    </div>`;
  }

  /** Texto de la prenda u objeto para búsquedas y CSV. */
  const zonasTexto = (p, sep) => MK.vistasDe(p).map((z) => MK.etiqueta(p, z)).join(sep);
  const prendaBusqueda = (p) =>
    esPrendaP(p) ? [MK.esObjeto(p) ? "objeto" : "prenda", ADM.prendaTexto(null, p), zonasTexto(p, " ")].join(" ") : "";

  /** Vistas del simulador que hacen de fotos de la prenda: frente y espalda si el logo puede ir ahí. */
  function vistasFoto(st) {
    const v = ["frente", "espalda"].filter((z) => st.ubicaciones.includes(z));
    return v.length ? v : [st.ubicaciones[0] || "frente"];
  }

  /** Fotos del simulador: prendas "mockup:<id>:frente|espalda"; objetos "objeto:<tipo>:1" (completo) y ":2" (detalle). */
  function refsSimulador(st, id) {
    const t = st.prenda.tipo;
    if (!t || !MK) return [];
    return esObjetoTipo(t) ? [`objeto:${t}:1`, `objeto:${t}:2`] : vistasFoto(st).map((v) => `mockup:${id}:${v}`);
  }

  /** Fotos al guardar. Con simulador: primero sus vistas, luego las fotos reales (sin las ilustraciones
      antiguas). Sin simulador: se quitan las vistas "mockup:" (dibujan una prenda) y se conservan las "objeto:". */
  function imagenesFinales(st, id) {
    if (!st.prenda.tipo) return st.imagenes.filter((x) => !esRefMockup(x) || esRefObjeto(x));
    const propias = st.imagenes.filter((x) => !esRefMockup(x));
    return refsSimulador(st, id).concat(propias.filter((x) => !esIlustracion(x)));
  }

  /* ==================== Resumen ==================== */
  function pintarResumen() {
    const conStock = A.products.filter((p) => !A.bajoPedido(p));
    const bajoPedido = A.products.length - conStock.length;
    const unidades = conStock.reduce((s, p) => s + totalFinito(p), 0);
    const valor = A.round2(conStock.reduce((s, p) => s + totalFinito(p) * p.precio, 0));
    const alertas = ADM.alertasStock();
    const agotadas = alertas.filter((a) => a.stock === 0);

    const items = [
      ["box", "", "Productos en catálogo", A.products.length, `${CATS().length - 1} categorías · ${bajoPedido} bajo pedido`, ""],
      ["package", "", "Piezas en inventario", unidades, `${conStock.length} producto(s) con inventario`, ""],
      ["dollar", "green", "Valor del inventario", A.fmtUSD(valor), A.fmtBsRaw(valor * A.config.bcvRate), ""],
      ["alert", agotadas.length ? "red" : alertas.length ? "amber" : "green", "Tallas por reponer", alertas.length,
        agotadas.length ? `${agotadas.length} agotada(s) · ${alertas.length - agotadas.length} con 3 o menos` : alertas.length ? "Quedan 3 unidades o menos" : "Todo con inventario sano",
        agotadas.length ? "critico" : alertas.length ? "alerta" : ""],
    ];
    $("resumen").innerHTML = items
      .map(([ic, col, dt, dd, sub, cls]) => `<div class="kpi ${cls}">
        <div class="kpi-ic ${col}">${A.icon(ic)}</div><dt>${dt}</dt><dd>${dd}</dd><span class="sub">${sub}</span></div>`)
      .join("");
  }

  function pintarFiltros() {
    $("filtroCat").innerHTML = CATS()
      .map((c) => `<button type="button" data-c="${c.id}" class="${c.id === F.cat ? "is-active" : ""}">${c.label}
        <span class="n">${c.id === "todas" ? A.products.length : A.products.filter((p) => p.categoria === c.id).length}</span></button>`)
      .join("");
  }

  $("filtroCat").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-c]");
    if (!b) return;
    F.cat = b.dataset.c; pintarFiltros(); pintar();
  });
  $("buscar").addEventListener("input", (e) => { F.texto = e.target.value.toLowerCase(); pintar(); });
  $("orden").addEventListener("change", (e) => { F.orden = e.target.value; pintar(); });

  const vendidos = () => {
    const m = {};
    ADM.ventasPorModelo().forEach((v) => (m[v.id] = v.unidades));
    return m;
  };

  function filtrados() {
    let lista = A.products.slice();
    if (F.cat !== "todas") lista = lista.filter((p) => p.categoria === F.cat);
    if (F.texto) {
      lista = lista.filter((p) =>
        [p.nombre, p.linea, p.categoriaLabel, Object.values(p.specs || {}).join(" "), (p.tallas || []).join(" "),
          (p.colores || []).map((c) => c.nombre).join(" "), (p.etiquetas || []).join(" "), A.bajoPedido(p) ? "bajo pedido" : "inventario", prendaBusqueda(p)]
          .join(" ").toLowerCase().includes(F.texto)
      );
    }
    const v = vendidos();
    // Los productos bajo pedido van al final cuando se ordena por stock
    const st = (p) => (A.bajoPedido(p) ? 1e9 : A.stockTotal(p));
    const ord = {
      nombre: (a, b) => a.nombre.localeCompare(b.nombre, "es"),
      "stock-asc": (a, b) => st(a) - st(b),
      "stock-desc": (a, b) => (A.bajoPedido(b) ? -1 : st(b)) - (A.bajoPedido(a) ? -1 : st(a)),
      "precio-asc": (a, b) => a.precio - b.precio,
      "precio-desc": (a, b) => b.precio - a.precio,
      vendidos: (a, b) => (v[b.id] || 0) - (v[a.id] || 0),
    }[F.orden];
    return lista.sort(ord);
  }

  /* ==================== Tabla ==================== */
  function pintar() {
    const lista = filtrados();
    const v = vendidos();
    $("contador").textContent = `${lista.length} ${lista.length === 1 ? "producto" : "productos"} en pantalla`;

    $("tabla").innerHTML = lista.length
      ? `<table class="tabla">
        <thead><tr>
          <th>Producto</th><th>Categoría</th><th class="num">Precio</th><th class="num">Vendidas</th>
          <th style="text-align:center">Stock</th><th>Estado</th><th class="acciones">Acciones</th>
        </tr></thead>
        <tbody>${lista.map((p) => {
          const esc = A.escalones(p);
          const colores = (p.colores || []);
          return `
          <tr>
            <td>
              <div class="row" style="gap:10px">
                <span class="mini-img"><img src="${A.img((p.imagenes || [])[0])}" alt=""></span>
                <span>
                  <span class="principal">${A.escape(p.nombre)}</span>
                  <div class="sec">${A.escape(p.linea || "")}${A.tieneTallas(p) ? " · " + p.tallas.length + " tallas" : " · sin talla"}${colores.length ? ` · <span class="lin-color" style="font-weight:500">${colores.slice(0, 5).map((c) => `<i style="background:${A.escape(c.hex)}" title="${A.escape(c.nombre)}"></i>`).join("")}</span>` : ""}</div>
                  ${prendaInfoHTML(p)}
                </span>
              </div>
            </td>
            <td class="small">${A.escape(p.categoriaLabel || p.categoria)}</td>
            <td class="num">
              <strong>${A.fmtUSD(p.precio)}</strong>
              ${p.precioAnterior ? `<div class="sec" style="text-decoration:line-through">${A.fmtUSD(p.precioAnterior)}</div>` : ""}
              ${esc.length ? `<div class="sec" title="${esc.map((e) => `desde ${e.desde}: ${A.fmtUSD(e.precio)}`).join(" · ")}">mayor desde ${A.fmtUSD(A.precioMinimo(p))}</div>` : ""}
            </td>
            <td class="num">${v[p.id] || 0}</td>
            <td style="text-align:center">
              ${A.bajoPedido(p)
                ? `<span class="badge badge-pedido">Bajo pedido</span><div class="sec" style="margin-top:4px">${p.diasProduccion || 0} día(s) de producción</div>`
                : `<button class="btn btn-ghost btn-sm" type="button" onclick="ajustarStock('${p.id}')" title="Ajustar stock">
                     <span class="stock-total">${A.stockTotal(p)}</span>&nbsp;unid. ${A.icon("edit", "icon-16")}
                   </button>
                   ${ADM.stockTallasHTML(p)}`}
            </td>
            <td>${ADM.stockBadge(p)}</td>
            <td class="acciones">
              ${A.bajoPedido(p) ? "" : `<button class="tbtn" type="button" onclick="ajustarStock('${p.id}')" title="Ajustar stock por talla">${A.icon("box")}</button>`}
              <a class="tbtn" href="../producto.html?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener" title="Ver en la tienda">${A.icon("eye")}</a>
              <button class="tbtn" type="button" onclick="editar('${p.id}')" title="Editar">${A.icon("edit")}</button>
              <button class="tbtn" type="button" onclick="duplicar('${p.id}')" title="Duplicar">${A.icon("copyDoc")}</button>
              <button class="tbtn danger" type="button" onclick="eliminar('${p.id}')" title="Dar de baja">${A.icon("trash")}</button>
            </td>
          </tr>`;
        }).join("")}
        </tbody></table>`
      : ADM.vacio("search", "Sin resultados", "Ningún producto coincide con el filtro.");
  }

  /* ==================== Ajuste de stock (por talla) ==================== */
  window.ajustarStock = function (id) {
    const p = A.getProduct(id);
    if (!p || A.bajoPedido(p)) return;
    const tallas = A.tieneTallas(p) ? p.tallas : [null];
    const celda = (t) => {
      const n = A.stockDe(p, t);
      return `<label class="${n === 0 ? "cero" : n <= ADM.STOCK_BAJO ? "bajo" : ""}">
        ${t ? "Talla " + A.escape(t) : "Unidades"}
        <input class="stock-input" type="number" min="0" step="1" value="${n}" data-talla="${t == null ? "" : A.escape(t)}">
        <span class="antes">antes: ${n}</span>
      </label>`;
    };
    ADM.modal({
      titulo: "Ajustar stock · " + A.escape(p.nombre),
      subtitulo: A.tieneTallas(p) ? "Cuenta lo que hay en el taller por talla" : "Producto sin talla",
      cuerpo: `
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px">
          <span class="small muted">Sumar a todas:</span>
          ${[1, 5, 10, 12].map((n) => `<button class="ed-preset" type="button" data-sumar="${n}">+${n}</button>`).join("")}
          <button class="ed-preset" type="button" data-sumar="0">Todo a 0</button>
        </div>
        <div class="stock-grid" id="gridAjuste">${tallas.map(celda).join("")}</div>
        <div class="field" style="margin-top:16px">
          <label for="motivoAjuste">Motivo</label>
          <select class="select" id="motivoAjuste">
            <option>Entrada de mercancía</option>
            <option>Conteo físico</option>
            <option>Merma o prenda dañada</option>
            <option>Venta fuera de la tienda en línea</option>
            <option>Corrección</option>
          </select>
        </div>`,
      pie: `<button class="btn btn-ghost" type="button" onclick="ADM.cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" type="button" id="okAjuste">${A.icon("save")} Guardar stock</button>`,
      alAbrir: (bg) => {
        bg.querySelectorAll("[data-sumar]").forEach((b) => (b.onclick = () => {
          const n = +b.dataset.sumar;
          bg.querySelectorAll("#gridAjuste input").forEach((i) => (i.value = n === 0 ? 0 : (parseInt(i.value, 10) || 0) + n));
        }));
        bg.querySelector("#okAjuste").onclick = () => {
          const cambios = [];
          bg.querySelectorAll("#gridAjuste input").forEach((i) => {
            const t = i.dataset.talla || null;
            const antes = A.stockDe(p, t);
            const nuevo = Math.max(0, parseInt(i.value, 10) || 0);
            if (nuevo !== antes) {
              A.ajustarStock(p, t, nuevo - antes);
              cambios.push(`${t ? t + ": " : ""}${antes} → ${nuevo}`);
            }
          });
          ADM.cerrarModal();
          if (!cambios.length) return A.toast("Sin cambios", "info");
          A.guardarCatalogo();
          A.bitacora.add("stock-ajustado", `${p.nombre} (${bg.querySelector("#motivoAjuste").value}): ${cambios.join(", ")}`, p.id);
          recargar(`Stock de ${p.nombre} actualizado`);
        };
      },
    });
  };

  /* ==================== Formulario de producto ==================== */
  const SPECS_SUGERIDAS = ["Material", "Técnica", "Área de impresión", "Cuello", "Capacidad", "Medidas", "Talla", "Incluye", "Cuidado", "Producción"];
  const PRESETS_TALLAS = [
    ["Adulto XS–3XL", ["XS", "S", "M", "L", "XL", "2XL", "3XL"]],
    ["Niño 2–14", ["2", "4", "6", "8", "10", "12", "14"]],
    ["Sin talla", []],
  ];

  /* Estado editable del formulario (tallas, stock, colores, escalones, specs, fotos, prenda) */
  function estadoInicial(p) {
    const c = JSON.parse(JSON.stringify(p));
    const pr = c.prenda && typeof c.prenda === "object" && MK && MK.TIPOS[c.prenda.tipo] ? c.prenda : null;
    const todas = zonasTipo(pr ? pr.tipo : "");
    const ubic = Array.isArray(c.ubicaciones) ? todas.filter((z) => c.ubicaciones.includes(z)) : [];
    return {
      prenda: { tipo: pr ? pr.tipo : "", cuello: pr && pr.cuello === "v" ? "v" : "redondo", infantil: !!(pr && pr.infantil) },
      ubicaciones: ubic.length ? ubic : todas,
      tipoTocado: false,
      modoStock: c.modoStock === "stock" ? "stock" : "pedido",
      tallas: Array.isArray(c.tallas) ? c.tallas.slice() : [],
      stockTallas: c.stockTallas || {},
      stock: Number(c.stock) || 0,
      colores: (c.colores || []).map((x) => ({ nombre: x.nombre, hex: x.hex || "#FFFFFF" })),
      escalones: (c.preciosMayor || []).map((e) => ({ desde: e.desde, precio: e.precio })),
      specs: Object.entries(c.specs || {}).map(([k, v]) => ({ k, v })),
      imagenes: (c.imagenes || []).slice(),
    };
  }

  function formulario(p) {
    const v = (x) => A.escape(x == null ? "" : x);
    return `
    <h4 class="form-sec">Datos básicos</h4>
    <div class="grid-2" style="gap:16px">
      <div class="field col-span-2">
        <label for="fNombre">Nombre del producto <span class="req">*</span></label>
        <input class="input" id="fNombre" value="${v(p.nombre)}" placeholder="Franela sublimada clásica">
      </div>
      <div class="field">
        <label for="fCategoria">Categoría</label>
        <select class="select" id="fCategoria">
          ${CATEGORIAS.map(([id, lb]) => `<option value="${id}"${p.categoria === id ? " selected" : ""}>${lb}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label for="fLinea">Línea</label>
        <input class="input" id="fLinea" value="${v(p.linea)}" placeholder="Básica, Deportiva, Corporativa…">
      </div>
    </div>

    <h4 class="form-sec">Prenda y logo</h4>
    <div class="stack-16">
      <div class="prenda-ctrl">
        <div class="field">
          <label for="fTipoPrenda">Tipo de pieza</label>
          <select class="select" id="fTipoPrenda">
            <option value="">Sin simulador (solo arte y nota)</option>
            ${[["Prendas", false], ["Objetos", true]].map(([grupo, obj]) => `<optgroup label="${grupo}">${Object.entries((MK && MK.TIPOS) || {})
              .filter(([id]) => esObjetoTipo(id) === obj)
              .map(([id, lb]) => `<option value="${id}">${A.escape(lb)}</option>`).join("")}</optgroup>`).join("")}
          </select>
        </div>
        <div class="field" id="campoCuello">
          <label id="lblCuello">Cuello</label>
          <div><div class="seg-toggle" id="edCuello" role="group" aria-labelledby="lblCuello">
            <button type="button" data-cuello="redondo">Redondo</button>
            <button type="button" data-cuello="v">En V</button>
          </div></div>
        </div>
        <label class="adm-check" id="campoInfantil"><input type="checkbox" id="fInfantil"> Talla de niño <span class="field-hint">(áreas × 0,75)</span></label>
      </div>
      <div class="field" id="campoZonas">
        <label id="lblZonas">Dónde puede ir el logo</label>
        <span class="field-hint">El cliente elige una o varias de estas zonas en el simulador y ahí mueve y ajusta su logo. La línea punteada es el área de impresión.</span>
        <div class="prenda-zonas" id="edZonas" role="group" aria-labelledby="lblZonas"></div>
      </div>
      <p class="small muted" id="prendaNo">No usa el simulador: el cliente adjunta su arte y una nota. Elige un tipo para que coloque su logo en una prenda, taza, gorra, mousepad o cojín.</p>
    </div>

    <h4 class="form-sec">Precios</h4>
    <div class="grid-2" style="gap:16px">
      <div class="field">
        <label for="fPrecio">Precio al detal por unidad (USD) <span class="req">*</span></label>
        <input class="input" id="fPrecio" type="number" min="0.5" step="0.5" value="${p.precio || ""}">
      </div>
      <div class="field">
        <label for="fPrecioAnt">Precio anterior tachado (opcional)</label>
        <input class="input" id="fPrecioAnt" type="number" min="0" step="0.5" value="${p.precioAnterior || ""}">
      </div>
      <div class="field col-span-2">
        <label>Precios al mayor</label>
        <span class="field-hint">Se aplican por cantidad total del producto en el pedido (todas sus tallas y colores).</span>
        <div class="ed-filas" id="edEscalones" style="margin-top:8px"></div>
        <div id="errEscalones" class="ed-error hidden"></div>
        <div class="ed-add"><button class="btn btn-ghost btn-sm" type="button" id="addEscalon">${A.icon("plus")} Agregar escalón</button></div>
      </div>
    </div>

    <h4 class="form-sec">Tallas e inventario</h4>
    <div class="stack-16">
      <div class="field">
        <label>Tallas</label>
        <div class="ed-chips" id="edTallas"></div>
        <div class="ed-add">
          ${PRESETS_TALLAS.map(([lb], i) => `<button class="ed-preset" type="button" data-preset="${i}">${lb}</button>`).join("")}
          <input class="input" id="nuevaTalla" placeholder="Otra talla (ej. 16)" maxlength="8">
          <button class="btn btn-ghost btn-sm" type="button" id="addTalla">${A.icon("plus")} Agregar</button>
        </div>
      </div>
      <div class="field">
        <label>Cómo se vende</label>
        <div><div class="seg-toggle" id="edModo">
          <button type="button" data-modo="pedido">Bajo pedido</button>
          <button type="button" data-modo="stock">Con inventario</button>
        </div></div>
        <div id="edStock" style="margin-top:12px"></div>
      </div>
      <div class="grid-2" style="gap:16px">
        <div class="field">
          <label for="fDias">Días de producción (tras aprobar el diseño)</label>
          <input class="input" id="fDias" type="number" min="0" max="60" step="1" value="${p.diasProduccion == null ? 3 : p.diasProduccion}">
        </div>
        <div class="field">
          <label for="fMinimo">Pedido mínimo (unidades del producto)</label>
          <input class="input" id="fMinimo" type="number" min="1" step="1" value="${p.pedidoMinimo || 1}">
        </div>
      </div>
    </div>

    <h4 class="form-sec">Colores base y diseño</h4>
    <div class="stack-16">
      <div class="field">
        <label id="lblColores">Colores base (prenda, malla, interior de taza)</label>
        <span class="field-hint" id="hintColores">Déjalo vacío si el cliente no elige color.</span>
        <div class="ed-filas" id="edColores" style="margin-top:8px"></div>
        <div class="ed-add" id="edColoresAdd">
          <button class="btn btn-ghost btn-sm" type="button" id="addColor">${A.icon("plus")} Agregar color</button>
          <button class="ed-preset" type="button" id="addBlanco">+ Blanco</button>
          <button class="ed-preset hidden" type="button" id="addPaleta">+ Blanco, Negro, Rojo y Azul</button>
        </div>
      </div>
      <div class="stack-4">
        <label class="adm-check"><input type="checkbox" id="fDiseno" ${p.permiteDiseno !== false ? "checked" : ""}>
          El cliente puede adjuntar su diseño (archivo y nota)</label>
        <span class="field-hint hidden" id="hintDiseno">Las piezas con simulador siempre llevan el logo del cliente.</span>
      </div>
    </div>

    <h4 class="form-sec">Ficha técnica</h4>
    <div class="ed-filas" id="edSpecs"></div>
    <datalist id="dlSpecs">${SPECS_SUGERIDAS.map((s) => `<option value="${s}">`).join("")}</datalist>
    <div class="ed-sugerencias" id="edSpecsSug"></div>
    <div class="ed-add"><button class="btn btn-ghost btn-sm" type="button" id="addSpec">${A.icon("plus")} Agregar dato</button></div>

    <h4 class="form-sec">Textos de la tienda</h4>
    <div class="grid-2" style="gap:16px">
      <div class="field col-span-2">
        <label for="fResumen">Resumen corto (aparece en el catálogo) <span class="req">*</span></label>
        <textarea class="textarea" id="fResumen" rows="2" placeholder="Franela cuello redondo en tela fría, sublimada con tu diseño…">${v(p.resumen)}</textarea>
      </div>
      <div class="field col-span-2">
        <label for="fDescripcion">Descripción</label>
        <textarea class="textarea" id="fDescripcion" rows="4">${v(p.descripcion)}</textarea>
      </div>
      <div class="field">
        <label for="fDestacados">Destacados (uno por línea)</label>
        <textarea class="textarea" id="fDestacados" rows="4">${v((p.destacados || []).join("\n"))}</textarea>
      </div>
      <div class="field">
        <label for="fEtiquetas">Etiquetas (separadas por coma)</label>
        <input class="input" id="fEtiquetas" value="${v((p.etiquetas || []).join(", "))}" placeholder="Más vendida, Regalo">
      </div>
    </div>

    <h4 class="form-sec">Fotos</h4>
    <div id="galeriaFotos" class="foto-galeria"></div>`;
  }

  /* Conecta los editores dinámicos del formulario con el estado */
  function montarEditores(bg, st) {
    const q = (s) => bg.querySelector(s);
    const esc = A.escape;

    /* --- Escalones al mayor --- */
    function pintarEscalones() {
      q("#edEscalones").innerHTML = st.escalones.length
        ? `<div class="ed-fila"><span class="ed-etq">Desde (unidades)</span><span class="ed-etq">Precio por unidad (USD)</span><span></span></div>` +
          st.escalones.map((e, i) => `<div class="ed-fila">
            <input class="input" type="number" min="2" step="1" value="${esc(e.desde)}" data-esc="${i}" data-campo="desde" aria-label="Desde">
            <input class="input" type="number" min="0.1" step="0.1" value="${esc(e.precio)}" data-esc="${i}" data-campo="precio" aria-label="Precio">
            <button class="tbtn danger" type="button" data-quitar-esc="${i}" title="Quitar">${A.icon("trash")}</button>
          </div>`).join("")
        : `<p class="small muted">Sin precios al mayor: todas las unidades al precio de detal.</p>`;
      validarEscalones();
    }
    q("#edEscalones").addEventListener("input", (e) => {
      const i = e.target.dataset.esc;
      if (i == null) return;
      st.escalones[i][e.target.dataset.campo] = e.target.value;
      validarEscalones();
    });
    q("#edEscalones").addEventListener("click", (e) => {
      const b = e.target.closest("[data-quitar-esc]");
      if (!b) return;
      st.escalones.splice(+b.dataset.quitarEsc, 1);
      pintarEscalones();
    });
    q("#addEscalon").onclick = () => {
      const base = parseFloat(q("#fPrecio").value) || 0;
      const ult = st.escalones[st.escalones.length - 1];
      const desde = ult ? (parseInt(ult.desde, 10) || 12) * 2 : 12;
      const precio = A.round2((ult ? parseFloat(ult.precio) || base : base) * 0.88);
      st.escalones.push({ desde, precio });
      pintarEscalones();
    };
    q("#fPrecio").addEventListener("input", validarEscalones);

    /* Devuelve el texto del error, o "" si todo está bien */
    function validarEscalones() {
      const base = parseFloat(q("#fPrecio").value) || 0;
      let err = "";
      let prevDesde = 1, prevPrecio = base;
      st.escalones.forEach((e, i) => {
        if (err) return;
        const d = parseInt(e.desde, 10), pr = parseFloat(e.precio);
        if (!(d >= 2)) err = `Escalón ${i + 1}: la cantidad mínima debe ser 2 o más.`;
        else if (!(pr > 0)) err = `Escalón ${i + 1}: indica un precio válido.`;
        else if (d <= prevDesde) err = `Escalón ${i + 1}: las cantidades deben ir de menor a mayor.`;
        else if (base && pr >= prevPrecio) err = `Escalón ${i + 1}: el precio debe ser menor que ${A.fmtUSD(prevPrecio)} (${i ? "escalón anterior" : "precio al detal"}).`;
        prevDesde = d; prevPrecio = pr;
      });
      const box = q("#errEscalones");
      box.textContent = err;
      box.classList.toggle("hidden", !err);
      return err;
    }
    st.validarEscalones = validarEscalones;

    /* --- Tallas --- */
    function pintarTallas() {
      q("#edTallas").innerHTML = st.tallas.length
        ? st.tallas.map((t, i) => `<span class="ed-chip">${esc(t)}<button type="button" data-quitar-talla="${i}" aria-label="Quitar talla ${esc(t)}">${A.icon("x")}</button></span>`).join("")
        : `<span class="small muted">Sin talla (taza, gorra, cojín…)</span>`;
      pintarStock();
    }
    q("#edTallas").addEventListener("click", (e) => {
      const b = e.target.closest("[data-quitar-talla]");
      if (!b) return;
      st.tallas.splice(+b.dataset.quitarTalla, 1);
      pintarTallas();
    });
    bg.querySelectorAll("[data-preset]").forEach((b) => (b.onclick = () => {
      st.tallas = PRESETS_TALLAS[+b.dataset.preset][1].slice();
      pintarTallas();
    }));
    const agregarTalla = () => {
      const t = q("#nuevaTalla").value.trim().toUpperCase();
      if (!t) return;
      if (st.tallas.includes(t)) return A.toast("Esa talla ya está", "alert");
      st.tallas.push(t);
      q("#nuevaTalla").value = "";
      pintarTallas();
    };
    q("#addTalla").onclick = agregarTalla;
    q("#nuevaTalla").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); agregarTalla(); } });

    /* --- Modo de stock y cantidades --- */
    function pintarStock() {
      bg.querySelectorAll("#edModo button").forEach((b) => b.classList.toggle("is-active", b.dataset.modo === st.modoStock));
      const host = q("#edStock");
      if (st.modoStock === "pedido") {
        host.innerHTML = `<p class="small muted">${A.icon("info", "icon-16")} Se produce al recibir el pedido: no lleva inventario ni se agota.</p>`;
        return;
      }
      if (st.tallas.length) {
        host.innerHTML = `<span class="field-hint">Unidades listas en el taller por talla</span>
          <div class="stock-grid" style="margin-top:6px">${st.tallas.map((t) => {
            const n = Number(st.stockTallas[t]) || 0;
            return `<label class="${n === 0 ? "cero" : n <= ADM.STOCK_BAJO ? "bajo" : ""}">${esc(t)}
              <input class="stock-input" type="number" min="0" step="1" value="${n}" data-stock-talla="${esc(t)}"></label>`;
          }).join("")}</div>`;
      } else {
        host.innerHTML = `<div class="field" style="max-width:220px"><label for="fStock">Unidades listas en el taller</label>
          <input class="input" id="fStock" type="number" min="0" step="1" value="${st.stock}"></div>`;
      }
    }
    q("#edModo").addEventListener("click", (e) => {
      const b = e.target.closest("[data-modo]");
      if (!b) return;
      st.modoStock = b.dataset.modo;
      pintarStock();
    });
    q("#edStock").addEventListener("input", (e) => {
      if (e.target.dataset.stockTalla != null) st.stockTallas[e.target.dataset.stockTalla] = Math.max(0, parseInt(e.target.value, 10) || 0);
      if (e.target.id === "fStock") st.stock = Math.max(0, parseInt(e.target.value, 10) || 0);
    });

    /* --- Colores (el cliente elige uno; en la vista previa del simulador se usa el primero) --- */
    function pintarColores() {
      q("#edColores").innerHTML = st.colores.length
        ? st.colores.map((c, i) => `<div class="ed-fila color">
            <input class="input" value="${esc(c.nombre)}" data-color="${i}" data-campo="nombre" placeholder="Nombre (ej. Blanco)" aria-label="Nombre del color">
            <input type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(c.hex) ? c.hex : "#ffffff")}" data-color="${i}" data-campo="hex" aria-label="Color">
            <button class="tbtn danger" type="button" data-quitar-color="${i}" title="Quitar">${A.icon("trash")}</button>
          </div>`).join("")
        : `<p class="small muted">Sin elección de color.</p>`;
    }
    const alCambiarColorBase = () => { if (st.prenda.tipo) { pintarZonas(); if (st.alCambiarPrenda) st.alCambiarPrenda(); } };
    q("#edColores").addEventListener("input", (e) => {
      const i = e.target.dataset.color;
      if (i == null) return;
      st.colores[i][e.target.dataset.campo] = e.target.dataset.campo === "hex" ? e.target.value.toUpperCase() : e.target.value;
      // La vista previa del simulador usa el primer color
      if (e.target.dataset.campo === "hex" && +i === 0) alCambiarColorBase();
    });
    q("#edColores").addEventListener("click", (e) => {
      const b = e.target.closest("[data-quitar-color]");
      if (!b) return;
      const i = +b.dataset.quitarColor;
      st.colores.splice(i, 1);
      pintarColores();
      if (i === 0) alCambiarColorBase();
    });
    q("#addColor").onclick = () => { st.colores.push({ nombre: "", hex: "#FFFFFF" }); pintarColores(); };
    q("#addBlanco").onclick = () => {
      if (st.colores.some((c) => /^blanc/i.test(c.nombre))) return;
      st.colores.push({ nombre: "Blanco", hex: "#FFFFFF" }); pintarColores(); if (st.colores.length === 1) alCambiarColorBase();
    };
    q("#addPaleta").onclick = () => {
      const vacio = !st.colores.length;
      PALETA_PRENDA.forEach((c) => {
        if (!st.colores.some((x) => String(x.nombre).trim().toLowerCase() === c.nombre.toLowerCase())) st.colores.push({ ...c });
      });
      pintarColores();
      if (vacio) alCambiarColorBase();
    };

    /* --- Ficha técnica --- */
    function pintarSpecs() {
      q("#edSpecs").innerHTML = st.specs.length
        ? st.specs.map((s, i) => `<div class="ed-fila spec">
            <input class="input" list="dlSpecs" value="${esc(s.k)}" data-spec="${i}" data-campo="k" placeholder="Dato" aria-label="Dato">
            <input class="input" value="${esc(s.v)}" data-spec="${i}" data-campo="v" placeholder="Valor" aria-label="Valor">
            <button class="tbtn danger" type="button" data-quitar-spec="${i}" title="Quitar">${A.icon("trash")}</button>
          </div>`).join("")
        : `<p class="small muted">Sin ficha técnica.</p>`;
      const usadas = st.specs.map((s) => s.k);
      q("#edSpecsSug").innerHTML = SPECS_SUGERIDAS.filter((s) => !usadas.includes(s))
        .map((s) => `<button type="button" data-sug="${esc(s)}">+ ${esc(s)}</button>`).join("");
    }
    q("#edSpecs").addEventListener("input", (e) => {
      const i = e.target.dataset.spec;
      if (i == null) return;
      st.specs[i][e.target.dataset.campo] = e.target.value;
    });
    q("#edSpecs").addEventListener("change", pintarSpecsSug);
    function pintarSpecsSug() {
      const usadas = st.specs.map((s) => s.k.trim());
      q("#edSpecsSug").innerHTML = SPECS_SUGERIDAS.filter((s) => !usadas.includes(s))
        .map((s) => `<button type="button" data-sug="${esc(s)}">+ ${esc(s)}</button>`).join("");
    }
    q("#edSpecs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-quitar-spec]");
      if (!b) return;
      st.specs.splice(+b.dataset.quitarSpec, 1);
      pintarSpecs();
    });
    q("#edSpecsSug").addEventListener("click", (e) => {
      const b = e.target.closest("[data-sug]");
      if (!b) return;
      st.specs.push({ k: b.dataset.sug, v: "" });
      pintarSpecs();
      const ins = bg.querySelectorAll('#edSpecs [data-campo="v"]');
      if (ins.length) ins[ins.length - 1].focus();
    });
    q("#addSpec").onclick = () => { st.specs.push({ k: "", v: "" }); pintarSpecs(); };

    /* --- Prenda u objeto: tipo, cuello, talla de niño y zonas del logo, con vista previa --- */
    const productoEnCurso = () => ({
      prenda: { tipo: st.prenda.tipo, cuello: st.prenda.cuello, infantil: st.prenda.infantil },
      colores: st.colores.slice(0, 1),
      ubicaciones: st.ubicaciones.slice(),
    });
    st.productoEnCurso = productoEnCurso;

    /* Reglas del simulador: solo zonas de ese tipo y al menos una para el logo */
    function reglasPrenda() {
      if (!st.prenda.tipo) return;
      const todas = zonasTipo(st.prenda.tipo);
      st.ubicaciones = todas.filter((z) => st.ubicaciones.includes(z));
      if (!st.ubicaciones.length) st.ubicaciones = todas;
    }

    function pintarZonas() {
      const host = q("#edZonas");
      const t = st.prenda.tipo;
      if (!t || !MK) { host.innerHTML = ""; return; }
      const act = document.activeElement;
      const foco = act && host.contains(act) ? act.value : null;
      const prod = productoEnCurso();
      host.innerHTML = zonasTipo(t).map((z) => {
        const on = st.ubicaciones.includes(z);
        const a = MK.areaCm(prod, z);
        return `<label class="zona-tile${on ? " is-on" : ""}">
          <span class="zona-svg" aria-hidden="true">${MK.svg(prod, z, { u: null, fondo: true, area: on, titulo: zonaLabel(t, z) })}</span>
          <span class="zona-txt"><input type="checkbox" value="${z}"${on ? " checked" : ""}>
            <span><strong>${esc(zonaLabel(t, z))}</strong><small>${a ? `Área ${ADM.cm(a.ancho)} × ${ADM.cm(a.alto)} cm` : ""}</small></span></span>
        </label>`;
      }).join("");
      if (foco) { const el = host.querySelector(`input[value="${foco}"]`); if (el) el.focus(); }
    }

    function pintarPrenda() {
      const on = !!st.prenda.tipo;
      const objeto = esObjetoTipo(st.prenda.tipo);
      const prenda = on && !objeto;
      q("#fTipoPrenda").value = st.prenda.tipo;
      q("#campoCuello").classList.toggle("hidden", !prenda || st.prenda.tipo === "chemise");
      bg.querySelectorAll("#edCuello button").forEach((b) => {
        const activo = b.dataset.cuello === st.prenda.cuello;
        b.classList.toggle("is-active", activo);
        b.setAttribute("aria-pressed", activo ? "true" : "false");
      });
      q("#campoInfantil").classList.toggle("hidden", !prenda);
      q("#fInfantil").checked = st.prenda.infantil;
      q("#campoZonas").classList.toggle("hidden", !on);
      q("#prendaNo").classList.toggle("hidden", on);
      pintarZonas();
      // Colores y diseño dependen del tipo
      q("#lblColores").textContent = prenda ? "Colores de la prenda" : objeto ? "Colores base (malla, interior de taza…)" : "Colores base (prenda, malla, interior de taza)";
      q("#hintColores").textContent = prenda
        ? "El cliente elige uno al comprar. El primero es el de las fotos del simulador."
        : "Déjalo vacío si el cliente no elige color.";
      q("#addPaleta").classList.toggle("hidden", !prenda);
      const fd = q("#fDiseno");
      if (on) fd.checked = true;
      fd.disabled = on;
      q("#hintDiseno").classList.toggle("hidden", !on);
      pintarColores();
      if (st.alCambiarPrenda) st.alCambiarPrenda();
    }

    function cambiarTipo(tipo, infantil) {
      const antes = st.prenda.tipo;
      st.prenda.tipo = tipo;
      if (infantil != null) st.prenda.infantil = infantil;
      // Entre prendas se conservan las zonas; si pasa a (o viene de) un objeto o de "sin simulador": todas las del tipo nuevo
      if (tipo && tipo !== antes && (!antes || esObjetoTipo(antes) || esObjetoTipo(tipo))) st.ubicaciones = zonasTipo(tipo);
      // Las prendas llevan al menos un color
      if (tipo && !esObjetoTipo(tipo) && !st.colores.length) st.colores = [{ ...PALETA_PRENDA[0] }];
      reglasPrenda();
      pintarPrenda();
    }

    q("#fTipoPrenda").addEventListener("change", (e) => { st.tipoTocado = true; cambiarTipo(e.target.value); });
    q("#edCuello").addEventListener("click", (e) => {
      const b = e.target.closest("[data-cuello]");
      if (!b || b.dataset.cuello === st.prenda.cuello) return;
      st.prenda.cuello = b.dataset.cuello;
      pintarPrenda();
    });
    q("#fInfantil").addEventListener("change", (e) => {
      st.prenda.infantil = e.target.checked;
      pintarZonas();
    });
    q("#edZonas").addEventListener("change", (e) => {
      const z = e.target.value;
      const todas = zonasTipo(st.prenda.tipo);
      if (!todas.includes(z)) return;
      if (!e.target.checked && st.ubicaciones.length === 1 && st.ubicaciones[0] === z) {
        e.target.checked = true;
        return A.toast("Deja al menos una zona para el logo", "alert");
      }
      const set = new Set(st.ubicaciones);
      if (e.target.checked) set.add(z); else set.delete(z);
      st.ubicaciones = todas.filter((x) => set.has(x));
      pintarZonas();
      if (st.alCambiarPrenda) st.alCambiarPrenda();
    });

    /* Producto nuevo: la categoría (y el nombre, en hogar y accesorios) sugiere el tipo mientras no se elija a mano */
    function tipoSugerido(cat) {
      const nombre = q("#fNombre").value;
      if (cat === "hogar") return /coj[ií]n|almohad/i.test(nombre) ? "cojin" : "taza";
      if (cat === "accesorios") return /mouse|pad\b/i.test(nombre) ? "mousepad" : "gorra";
      return { franelas: "franela", deportiva: "franela", chemises: "chemise", ninos: "franela" }[cat];
    }
    q("#fCategoria").addEventListener("change", (e) => {
      const tipo = tipoSugerido(e.target.value);
      if (!st.esNuevo || st.tipoTocado || tipo == null || !MK || !MK.TIPOS[tipo]) return;
      cambiarTipo(tipo, e.target.value === "ninos");
    });

    pintarEscalones(); pintarTallas(); pintarSpecs();
    reglasPrenda();
    pintarPrenda();
  }

  function slug(txt) {
    return String(txt).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 48) || "producto";
  }

  function leerFormulario(bg, base, st) {
    const g = (id) => bg.querySelector("#" + id).value.trim();

    const nombre = g("fNombre");
    const precio = parseFloat(g("fPrecio"));
    const resumen = g("fResumen");
    if (!nombre || nombre.length < 3) { A.toast("El nombre es obligatorio", "alert"); return null; }
    if (!precio || precio <= 0) { A.toast("Indica un precio al detal válido", "alert"); return null; }
    if (st.validarEscalones()) { A.toast("Revisa los precios al mayor", "alert"); return null; }
    if (!resumen) { A.toast("Escribe el resumen corto", "alert"); return null; }
    const tipo = st.prenda.tipo;
    const objeto = esObjetoTipo(tipo);
    const zonas = tipo ? zonasTipo(tipo).filter((z) => st.ubicaciones.includes(z)) : [];
    if (tipo && !zonas.length) { A.toast("Elige al menos una zona donde pueda ir el logo", "alert"); return null; }
    let colores = st.colores.map((c) => ({ nombre: String(c.nombre || "").trim(), hex: c.hex || "#FFFFFF" }));
    // Las prendas llevan al menos un color (el cliente elige entre los que haya)
    if (tipo && !objeto && !colores.length) colores = [{ ...PALETA_PRENDA[0] }];
    if (colores.some((c) => !c.nombre)) { A.toast("Ponle nombre a cada color", "alert"); return null; }
    if (new Set(colores.map((c) => c.nombre.toLowerCase())).size !== colores.length) { A.toast("Hay colores repetidos", "alert"); return null; }

    const specs = {};
    st.specs.forEach((s) => { const k = String(s.k || "").trim(), v = String(s.v || "").trim(); if (k && v) specs[k] = v; });

    const catSel = bg.querySelector("#fCategoria");
    const conStock = st.modoStock === "stock";
    const stockTallas = {};
    if (conStock && st.tallas.length) st.tallas.forEach((t) => (stockTallas[t] = Math.max(0, Number(st.stockTallas[t]) || 0)));
    const precioAnt = parseFloat(g("fPrecioAnt"));

    return {
      ...base,
      nombre,
      linea: g("fLinea") || catSel.options[catSel.selectedIndex].text,
      categoria: catSel.value,
      categoriaLabel: catSel.options[catSel.selectedIndex].text,
      precio: A.round2(precio),
      precioAnterior: precioAnt > precio ? A.round2(precioAnt) : null,
      preciosMayor: st.escalones.map((e) => ({ desde: parseInt(e.desde, 10), precio: A.round2(parseFloat(e.precio)) })).sort((a, b) => a.desde - b.desde),
      modoStock: conStock ? "stock" : "pedido",
      tallas: st.tallas.slice(),
      stockTallas,
      stock: conStock && !st.tallas.length ? Math.max(0, Number(st.stock) || 0) : 0,
      colores,
      // Simulador: prendas { tipo, cuello, infantil } (la chemise siempre es cuello polo); objetos solo { tipo }
      prenda: !tipo ? null
        : objeto ? { tipo }
        : tipo === "chemise" ? { tipo, infantil: !!st.prenda.infantil }
        : { tipo, cuello: st.prenda.cuello === "v" ? "v" : "redondo", infantil: !!st.prenda.infantil },
      ubicaciones: zonas,
      permiteDiseno: tipo ? true : bg.querySelector("#fDiseno").checked,
      diasProduccion: Math.max(0, parseInt(g("fDias"), 10) || 0),
      pedidoMinimo: Math.max(1, parseInt(g("fMinimo"), 10) || 1),
      etiquetas: g("fEtiquetas").split(",").map((x) => x.trim()).filter(Boolean),
      resumen,
      descripcion: g("fDescripcion") || resumen,
      destacados: g("fDestacados").split("\n").map((x) => x.trim()).filter(Boolean),
      specs,
      imagenes: imagenesFinales(st, base.id),
    };
  }

  const resumenStock = (p) => (A.bajoPedido(p) ? "bajo pedido" : `${A.stockTotal(p)} unid.`);

  /* ==================== Galería de fotos (subir / eliminar) ==================== */
  /* Con servidor y producto ya guardado: las fotos se suben/borran al instante (WebP).
     Sin servidor o con producto nuevo: se agregan por nombre de archivo o URL y se
     guardan junto con el resto del formulario. */
  function pintarGaleria(host, p, st, esNuevo) {
    const directo = A.modoServidor && !esNuevo;
    const prenda = !!(st.prenda.tipo && MK);
    // Las vistas del simulador no se guardan como fotos sueltas: se generan con el tipo de pieza.
    // Sin simulador, las vistas "objeto:" se conservan y se muestran como fotos normales.
    const fotos = st.imagenes.map((url, i) => ({ url, i }))
      .filter(({ url }) => (prenda ? !esRefMockup(url) && !esIlustracion(url) : !esRefMockup(url) || esRefObjeto(url)));
    const viejas = prenda ? st.imagenes.filter(esIlustracion).length : 0;
    const prod = prenda ? st.productoEnCurso() : null;
    const vistas = prenda
      ? refsSimulador(st, p.id || "nuevo").map((ref) => {
          const [, , v] = ref.split(":");
          return esRefObjeto(ref)
            ? { src: MK.urlDeRef(ref), label: v === "2" ? "Detalle" : "Completo" }
            : { src: MK.dataURL(prod, v), label: MK.VISTAS[v].corto };
        })
      : [];
    host.innerHTML = `
      <div class="foto-grid">
        ${vistas.map((v) => `
          <div class="foto-item foto-sim" title="Vista del simulador: se genera sola con el tipo de pieza">
            <img src="${v.src}" alt="Vista del simulador: ${A.escape(v.label)}">
            <span class="foto-tag">Simulador · ${A.escape(v.label)}</span>
          </div>`).join("")}
        ${fotos.map(({ url, i }) => `
          <div class="foto-item">
            <img src="${A.escape(A.img(url))}" alt="">
            <button class="foto-borrar" type="button" title="Eliminar foto" data-url="${A.escape(url)}" data-i="${i}">${A.icon("x")}</button>
          </div>`).join("")}
        ${directo ? `<label class="foto-agregar">
          ${A.icon("plusCircle")}
          <span>Agregar foto</span>
          <input type="file" accept="image/png,image/jpeg,image/webp" hidden id="inputFoto">
        </label>` : ""}
      </div>
      ${prenda
        ? `<p class="tiny muted" style="margin-top:8px">Las vistas del simulador van primero y se generan solas con el tipo de pieza${esObjetoTipo(st.prenda.tipo) ? "" : ", el color y las zonas del logo"}. Las fotos reales que agregues se muestran después.${viejas ? ` Al guardar se quitan ${viejas} ilustración(es) antigua(s).` : ""}</p>`
        : !fotos.length ? `<p class="tiny muted" style="margin-top:8px">Sin fotos: la tienda mostrará una imagen genérica.</p>` : ""}
      ${directo
        ? `<p class="tiny muted" style="margin-top:8px">JPG, PNG o WEBP · máximo 6 MB. Se convierte a WebP, se sube y se ve en la tienda de inmediato.</p>`
        : `<div class="ed-add">
             <input class="input" id="fotoRuta" placeholder="archivo.webp o https://…" style="max-width:320px">
             <button class="btn btn-ghost btn-sm" type="button" id="addFotoRuta">${A.icon("plus")} Agregar</button>
           </div>
           <p class="tiny muted" style="margin-top:6px">${A.modoServidor
             ? "Guarda el producto primero para subir fotos desde tu computadora."
             : "Sin servidor no se pueden subir fotos: escribe el nombre de un archivo de assets/img/ o una URL completa."}</p>`}`;

    if (!directo) {
      const add = () => {
        const r = host.querySelector("#fotoRuta").value.trim();
        if (!r) return;
        if (/^(javascript|data):/i.test(r)) return A.toast("Ruta no válida", "alert");
        st.imagenes.push(r);
        pintarGaleria(host, p, st, esNuevo);
      };
      host.querySelector("#addFotoRuta").onclick = add;
      host.querySelector("#fotoRuta").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
      host.querySelectorAll(".foto-borrar").forEach((btn) => (btn.onclick = () => {
        st.imagenes.splice(+btn.dataset.i, 1);
        pintarGaleria(host, p, st, esNuevo);
      }));
      return;
    }

    host.querySelectorAll(".foto-borrar").forEach((btn) => {
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          const r = await A.api.eliminarImagenProducto(p.id, btn.dataset.url);
          p.imagenes = r.imagenes;
          st.imagenes = (r.imagenes || []).slice();
          const enLista = A.getProduct(p.id);
          if (enLista) enLista.imagenes = r.imagenes;
          pintarGaleria(host, p, st, esNuevo);
          A.toast("Foto eliminada", "checkCircle");
        } catch (e) {
          A.toast(e.message || "No se pudo eliminar la foto.", "alert");
          btn.disabled = false;
        }
      };
    });

    const input = host.querySelector("#inputFoto");
    input.onchange = async () => {
      const archivo = input.files[0];
      if (!archivo) return;
      if (archivo.size > 6 * 1024 * 1024) { A.toast("La foto pesa más de 6 MB.", "alert"); return; }
      try {
        const { base64, tipo, original } = await A.aWebP(archivo);
        let dataFinal = base64, tipoFinal = tipo;
        if (original || !base64) {
          // No se pudo convertir (formato raro, navegador viejo, etc.) — sube el archivo tal cual.
          dataFinal = await new Promise((resolve, reject) => {
            const l = new FileReader();
            l.onload = () => resolve(l.result.split(",")[1]);
            l.onerror = reject;
            l.readAsDataURL(archivo);
          });
          tipoFinal = archivo.type;
        }
        const r = await A.api.subirImagenProducto(p.id, dataFinal, tipoFinal);
        p.imagenes = r.imagenes;
        st.imagenes = (r.imagenes || []).slice();
        const enLista = A.getProduct(p.id);
        if (enLista) enLista.imagenes = r.imagenes;
        pintarGaleria(host, p, st, esNuevo);
        A.toast("Foto agregada", "checkCircle");
      } catch (e) {
        A.toast(e.message || "No se pudo subir la foto.", "alert");
      }
    };
  }

  window.editar = function (id) {
    const p = A.getProduct(id);
    if (!p) return;
    const st = estadoInicial(p);
    ADM.modal({
      titulo: "Editar " + A.escape(p.nombre),
      subtitulo: "Los cambios se ven en la tienda de inmediato",
      ancho: "ancho",
      cuerpo: formulario(p),
      pie: `<button class="btn btn-ghost" type="button" onclick="ADM.cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" type="button" id="okGuardar">${A.icon("save")} Guardar cambios</button>`,
      alAbrir: (bg) => {
        montarEditores(bg, st);
        const galeria = bg.querySelector("#galeriaFotos");
        st.alCambiarPrenda = () => pintarGaleria(galeria, p, st, false);
        pintarGaleria(galeria, p, st, false);

        bg.querySelector("#okGuardar").onclick = () => {
          const nuevo = leerFormulario(bg, p, st);
          if (!nuevo) return;
          const i = A.products.findIndex((x) => x.id === id);
          A.products[i] = nuevo;
          A.guardarCatalogo();
          A.bitacora.add("modelo-editado", `Se editó ${nuevo.nombre} (${A.fmtUSD(nuevo.precio)}, ${resumenStock(nuevo)})`, id);
          ADM.cerrarModal();
          recargar("Producto actualizado");
        };
      },
    });
  };

  $("btnNuevo").onclick = function () {
    const base = {
      id: "", rating: 5, reviews: 0, opiniones: [], activo: true,
      categoria: "franelas", modoStock: "pedido", tallas: [], stockTallas: {}, stock: 0,
      colores: PALETA_PRENDA.map((c) => ({ ...c })), preciosMayor: [], permiteDiseno: true,
      // La categoría por defecto es Franelas: arranca como franela con el logo en cualquier zona
      prenda: MK ? { tipo: "franela", cuello: "redondo", infantil: false } : null, ubicaciones: ZONAS.slice(),
      diasProduccion: 3, pedidoMinimo: 1, etiquetas: ["Nuevo"], specs: {}, imagenes: [], destacados: [],
    };
    const st = estadoInicial(base);
    st.esNuevo = true;
    ADM.modal({
      titulo: "Nuevo producto",
      subtitulo: "Aparecerá en el catálogo público apenas lo guardes",
      ancho: "ancho",
      cuerpo: formulario(base),
      pie: `<button class="btn btn-ghost" type="button" onclick="ADM.cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" type="button" id="okCrear">${A.icon("plusCircle")} Crear producto</button>`,
      alAbrir: (bg) => {
        montarEditores(bg, st);
        const galeria = bg.querySelector("#galeriaFotos");
        st.alCambiarPrenda = () => pintarGaleria(galeria, base, st, true);
        pintarGaleria(galeria, base, st, true);
        bg.querySelector("#okCrear").onclick = () => {
          const nuevo = leerFormulario(bg, base, st);
          if (!nuevo) return;
          const raiz = slug(nuevo.nombre);
          let id = raiz, n = 1;
          while (A.getProduct(id)) id = raiz + "-" + ++n;
          nuevo.id = id;
          nuevo.imagenes = imagenesFinales(st, id); // las vistas del simulador llevan el id definitivo
          A.products.unshift(nuevo);
          A.guardarCatalogo();
          A.bitacora.add("modelo-creado", `Se creó ${nuevo.nombre} (${resumenStock(nuevo)})`, id);
          ADM.cerrarModal();
          recargar("Producto creado en el catálogo");
        };
      },
    });
  };

  window.duplicar = function (id) {
    const p = A.getProduct(id);
    ADM.confirmar("Duplicar producto", `Se creará una copia de <strong>${A.escape(p.nombre)}</strong> con el stock en 0 para que la edites.`, () => {
      const copia = JSON.parse(JSON.stringify(p));
      copia.id = p.id + "-copia";
      let n = 1;
      while (A.getProduct(copia.id)) copia.id = p.id + "-copia-" + ++n;
      copia.nombre = p.nombre + " (copia)";
      // Las vistas del simulador apuntan al producto: que la copia use las suyas
      copia.imagenes = (copia.imagenes || []).map((x) => (esRefMockup(x) ? x.replace(/^mockup:[^:]*:/, "mockup:" + copia.id + ":") : x));
      copia.stock = 0;
      copia.stockTallas = {};
      (copia.tallas || []).forEach((t) => { if (copia.modoStock === "stock") copia.stockTallas[t] = 0; });
      copia.reviews = 0;
      copia.opiniones = [];
      A.products.unshift(copia);
      A.guardarCatalogo();
      A.bitacora.add("modelo-duplicado", `Copia creada de ${p.nombre}`, copia.id);
      recargar("Copia creada. Edítala antes de publicarla.");
      editar(copia.id);
    }, "Duplicar");
  };

  window.eliminar = function (id) {
    const p = A.getProduct(id);
    const enPedidos = A.orders.all().filter((o) => o.items.some((i) => i.id === id)).length;
    ADM.confirmar(
      "Dar de baja " + p.nombre,
      `Se quitará del catálogo público${A.bajoPedido(p) ? "" : ` y del inventario (${A.stockTotal(p)} unidades)`}.` +
        (enPedidos ? ` Hay <strong>${enPedidos} pedido(s)</strong> que lo incluyen: esos pedidos conservan su información.` : ""),
      async () => {
        try {
          if (A.modoServidor) {
            await A.api.darDeBajaProducto(id);
            A.products = A.products.filter((x) => x.id !== id);
          } else {
            // Sin servidor: se quita del catálogo guardado en este navegador
            A.products = A.products.filter((x) => x.id !== id);
            A.guardarCatalogo();
          }
          A.bitacora.add("modelo-eliminado", `Se dio de baja ${p.nombre}`, id);
          recargar("Producto dado de baja");
        } catch (e) {
          A.toast(e.message || "No se pudo dar de baja el producto.", "alert");
        }
      },
      "Dar de baja",
      true
    );
  };

  $("btnRestaurar").onclick = () =>
    ADM.confirmar(
      "Restaurar el catálogo original",
      `Vuelve a los ${A.productosSemilla.length} productos de fábrica con sus precios y stock iniciales. Se pierden los productos que hayas creado y los ajustes de stock.`,
      () => { A.restaurarCatalogo(); A.bitacora.add("catalogo-restaurado", "Catálogo devuelto a los valores originales"); recargar("Catálogo restaurado"); },
      "Restaurar",
      true
    );

  /* ==================== Movimientos ==================== */
  function pintarMovimientos() {
    const movs = A.bitacora.all()
      .filter((b) => ["stock-ajustado", "modelo-creado", "modelo-editado", "modelo-eliminado", "modelo-duplicado", "catalogo-restaurado", "pedido-creado", "pedido-cancelado"].includes(b.accion))
      .slice(0, 12);

    $("movimientos").innerHTML = movs.length
      ? movs.map((m) => `<div class="alerta-fila">
          <span class="kpi-ic ${m.accion === "modelo-eliminado" ? "red" : m.accion === "modelo-creado" ? "green" : ""}" style="margin:0;width:32px;height:32px">
            ${A.icon({ "stock-ajustado": "box", "modelo-creado": "plusCircle", "modelo-editado": "edit", "modelo-eliminado": "trash", "modelo-duplicado": "copyDoc", "catalogo-restaurado": "refresh", "pedido-creado": "receipt", "pedido-cancelado": "xCircle" }[m.accion] || "box", "icon-16")}
          </span>
          <div class="grow">
            <strong style="font-size:.86rem;color:var(--brand-deep);display:block">${A.escape(m.detalle)}</strong>
            <span class="tiny muted">${A.escape(m.usuario)} · ${ADM.hace(m.fecha)}</span>
          </div>
        </div>`).join("")
      : `<p class="small muted">Todavía no hay movimientos registrados.</p>`;
  }

  /* ==================== Exportar ==================== */
  $("btnCSV").onclick = () => {
    const v = vendidos();
    ADM.exportarCSV(
      "inventario-estampy",
      ["Codigo", "Producto", "Linea", "Categoria", "Precio USD", "Precio Bs", "Precios al mayor", "Modo", "Tallas", "Stock total", "Stock por talla",
        "Colores", "Permite diseno", "Prenda", "Zonas del logo", "Dias produccion", "Pedido minimo", "Vendidas", "Valor inventario USD", "Material"],
      filtrados().map((p) => {
        const total = A.bajoPedido(p) ? "" : A.stockTotal(p);
        return [
          p.id, p.nombre, p.linea, p.categoriaLabel,
          Number(p.precio).toFixed(2), (p.precio * A.config.bcvRate).toFixed(2),
          A.escalones(p).map((e) => `desde ${e.desde}: ${e.precio.toFixed(2)}`).join(" | "),
          A.bajoPedido(p) ? "Bajo pedido" : "Con inventario",
          (p.tallas || []).join(" "),
          total,
          !A.bajoPedido(p) && A.tieneTallas(p) ? p.tallas.map((t) => `${t}:${A.stockDe(p, t)}`).join(" ") : "",
          (p.colores || []).map((c) => c.nombre).join(" | "),
          p.permiteDiseno ? "Si" : "No",
          esPrendaP(p) ? ADM.prendaTexto(null, p) : "",
          esPrendaP(p) ? zonasTexto(p, " | ") : "",
          p.diasProduccion || 0, p.pedidoMinimo || 1,
          v[p.id] || 0,
          total === "" ? "" : (total * p.precio).toFixed(2),
          (p.specs || {}).Material || "",
        ];
      })
    );
  };

  function recargar(mensaje) {
    pintarResumen(); pintarFiltros(); pintar(); pintarMovimientos();
    if (mensaje) A.toast(mensaje, "checkCircle");
  }

  recargar();
})();
</script>
</body>
