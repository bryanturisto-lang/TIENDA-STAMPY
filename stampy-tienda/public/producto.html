<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto — Estampy</title>
<meta name="description" content="Productos sublimados con tu diseño a todo color: tallas, colores, precios al mayor y tiempos de producción.">
<link rel="icon" href="assets/img/estampy-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div id="app-header"></div>

<main id="contenido">
  <div class="wrap" style="padding-bottom:24px">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta de navegación"></nav>
    <div class="pdp" id="pdp"></div>
  </div>

  <section class="section section--tight" id="detalles">
    <div class="wrap">
      <div class="tabs" id="tabs" role="tablist" aria-label="Detalles del producto"></div>
      <div id="tabPanels"></div>
    </div>
  </section>

  <section class="section section--tint">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow">También te puede servir</span>
        <h2>Combina tu pedido</h2>
      </div>
      <div class="grid-products" id="relacionados"></div>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/mockup.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async function () {
  const A = window.STAMPY;
  const CFG = A.config;
  A.basePath = "";
  await A.init("catalogo");

  const $ = (s) => document.getElementById(s);
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const p = id ? A.getProduct(id) : null;

  if (!p || p.activo === false) {
    document.querySelector(".pdp").style.display = "block";
    $("pdp").innerHTML = `
      <div class="empty-state">
        ${A.icon("alert", "", 46)}
        <h2 style="margin-bottom:8px">No encontramos ese producto</h2>
        <p class="small">${id ? `<strong>${A.escape(id)}</strong> no está en el catálogo o ya no está disponible.` : "No indicaste qué producto quieres ver."}</p>
        <a class="btn btn-dark" style="margin-top:18px" href="index.html#catalogo">Ver el catálogo</a>
      </div>`;
    $("breadcrumb").innerHTML = '<a href="index.html">Inicio</a><span>/</span><span>No encontrado</span>';
    $("detalles").classList.add("hidden");
    $("relacionados").innerHTML = A.products.filter((x) => x.activo !== false).slice(0, 4).map(A.cardHTML).join("");
    return;
  }

  document.title = p.nombre + " — Estampy";
  document.querySelector('meta[name="description"]').setAttribute("content", p.resumen || "");

  const tieneTallas = A.tieneTallas(p);
  const bajoPedido = A.bajoPedido(p);
  const colores = Array.isArray(p.colores) ? p.colores : [];
  const escalones = A.escalones(p);
  const pedMin = Math.max(1, Number(p.pedidoMinimo) || 1);
  const diasProd = Number(p.diasProduccion) || 0;
  const maxMB = Number((CFG.disenos && CFG.disenos.maxMB) || 8);
  const formatos = (CFG.disenos && CFG.disenos.formatos) || "PNG, JPG, WEBP o PDF";
  const dsc = p.precioAnterior ? Math.round((1 - p.precio / p.precioAnterior) * 100) : 0;
  const est = A.estadoStock(p);
  const imagenes = (p.imagenes && p.imagenes.length) ? p.imagenes : [""];
  // Prendas: un solo color y simulador para ubicar el logo (frente, espalda, mangas)
  const esPrenda = !!(A.mockup && p.permiteDiseno && A.mockup.vistasDe(p).length);
  const fotosReales = (p.imagenes || []).filter((x) => /^https?:/.test(x));
  // Línea de datos cortos: Unisex · Tallas XS–3XL · Blanco · 150 g/m²
  const sc = A.specsCortas(p);
  const chipsFicha = [sc.genero, sc.tallasLargo, sc.color, sc.extra, sc.minimo].filter(Boolean);
  const etiqueta = (p.etiquetas || [])[0];

  /* ---------------- Migas de pan ---------------- */
  $("breadcrumb").innerHTML = `
    <a href="index.html">Inicio</a><span>/</span>
    <a href="index.html?filtro=${encodeURIComponent(p.categoria)}#catalogo">${A.escape(p.categoriaLabel)}</a><span>/</span>
    <span class="muted">${A.escape(p.nombre)}</span>`;

  /* ---------------- Estado de la compra ---------------- */
  const S = {
    color: colores.length ? colores[0].nombre : null,
    cant: {},                                   // { talla: n } o { _: n }
    archivo: null,                              // { url, ruta, nombre } o { nombre }
    logo: null,                                 // prenda: { src, ratio, tipo } para el simulador
    preview: "",                                // prenda: imagen pequeña del logo para el carrito
    logoPorWhatsApp: false,                     // prenda: el cliente manda el logo después
    subiendo: false,
    errorArchivo: "",
    avisoArchivo: "",
  };
  if (!tieneTallas) S.cant._ = pedMin;

  const maxDe = (t) => {
    const libre = A.stockDe(p, t === "_" ? null : t) - A.cart.enCarrito(p.id, t === "_" ? null : t);
    return Math.max(0, Math.min(999, libre));
  };
  const totalSel = () => Object.values(S.cant).reduce((s, n) => s + (Number(n) || 0), 0);

  /* Zonas para el plazo estimado */
  const zonas = CFG.zonas || [];
  const envMin = zonas.length ? Math.min(...zonas.map((z) => z.dias)) : 1;
  const envMax = zonas.length ? Math.max(...zonas.map((z) => z.dias)) : 5;

  /* Simulador: caras donde puede ir el logo y numeración de los pasos (el color va primero si hay varios) */
  const zonasLogo = esPrenda ? A.mockup.vistasDe(p) : [];
  const nombreZona = (z) => (typeof A.mockup.etiqueta === "function" ? A.mockup.etiqueta(p, z) : ((A.mockup.VISTAS || {})[z] || {}).label) || z;
  const enMinuscula = (s) => String(s).charAt(0).toLowerCase() + String(s).slice(1);
  const listaZonas = zonasLogo.map((z) => enMinuscula(nombreZona(z)));
  const pistaZonas = listaZonas.length > 1
    ? `Una o varias ${A.mockup.esObjeto(p) ? "caras" : "partes"}: ${listaZonas.slice(0, -1).join(", ")} o ${listaZonas[listaZonas.length - 1]}`
    : listaZonas.length ? `Va en: ${listaZonas[0]}` : "";
  let nPaso = 0;
  const pasoColor = esPrenda && colores.length > 1 ? ++nPaso : 0;
  const pasoLogo = esPrenda ? ++nPaso : 0;
  const pasoDonde = esPrenda ? ++nPaso : 0;
  const pasoCant = esPrenda ? ++nPaso : 0;
  const swatchesHTML = colores.length > 1 ? `
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Color">
          ${colores.map((c, i) => `<button class="swatch${i === 0 ? " is-active" : ""}" type="button" role="radio" aria-checked="${i === 0}"
              data-color="${A.escape(c.nombre)}" title="${A.escape(c.nombre)}" aria-label="${A.escape(c.nombre)}"><i style="background:${A.escape(c.hex)}"></i></button>`).join("")}
        </div>` : "";

  /* ---------------- Ficha principal ---------------- */
  $("pdp").innerHTML = `
  ${esPrenda ? `
  <div class="gallery gallery--editor" id="editorLogo">
    ${pasoColor ? `
    <div class="logo-step"><b>${pasoColor}</b><span>Elige el color</span><span class="logo-step-val" id="colorNombre">${A.escape(S.color)}</span></div>
    ${swatchesHTML}` : ""}
    <div class="logo-step"><b>${pasoLogo}</b><span>Sube tu logo</span><small>${A.escape(formatos)} · hasta ${maxMB} MB</small></div>
    <div class="logo-upload" id="logoUpload">
      <div id="disenoArchivo"></div>
      <label class="logo-wa"><input type="checkbox" id="logoWA"><span>No lo tengo a mano: <strong>te lo envío por WhatsApp</strong> y lo ubican donde lo marque aquí.</span></label>
    </div>
    <div class="logo-step"><b>${pasoDonde}</b><span>Elige dónde va</span><small>${A.escape(pistaZonas)}</small></div>
    <div id="mkEditor"></div>
    ${fotosReales.length ? `<div>
      <div class="buy-label"><span>Fotos reales</span></div>
      <div class="mk-fotos">${fotosReales.map((u) => `<a href="${A.escape(u)}" target="_blank" rel="noopener"><img src="${A.escape(u)}" alt="Foto de ${A.escape(p.nombre)}"></a>`).join("")}</div>
    </div>` : ""}
    <div class="notice notice-blue">
      ${A.icon("info")}
      <span>Es una simulación. Antes de producir te enviamos por WhatsApp la prueba con tu logo y las medidas exactas para que la apruebes.</span>
    </div>
  </div>` : `
  <div class="gallery">
    <div class="gallery-main">
      <img id="galleryMain" src="${A.img(imagenes[0])}" alt="${A.escape(p.nombre)}">
      ${dsc > 0 ? `<span class="badge badge-solid" style="position:absolute;top:16px;left:16px">−${dsc}% · antes ${A.fmtUSD(p.precioAnterior)}</span>` : ""}
    </div>
    ${imagenes.length > 1 ? `<div class="gallery-thumbs" id="galleryThumbs">
      ${imagenes.map((im, i) => `
        <button class="gallery-thumb${i === 0 ? " is-active" : ""}" type="button" data-src="${A.img(im)}" aria-label="Vista ${i + 1}">
          <img src="${A.img(im)}" alt="">
        </button>`).join("")}
    </div>` : ""}
    <div class="notice notice-blue" style="margin-top:16px">
      ${A.icon("info")}
      <span>La imagen es una muestra: tu pieza lleva tu diseño. Antes de producir te enviamos la prueba por WhatsApp para que la apruebes.</span>
    </div>
  </div>`}

  <div class="pdp-info stack-16">
    <div>
      ${etiqueta || (esPrenda && dsc > 0) ? `<div class="pdp-badges">
        ${etiqueta ? `<span class="badge badge-ink">${A.escape(etiqueta)}</span>` : ""}
        ${esPrenda && dsc > 0 ? `<span class="badge badge-solid">−${dsc}%</span>` : ""}
      </div>` : ""}
      <h1>${A.escape(p.nombre)}</h1>
      <div class="pdp-rating">
        ${A.stars(p.rating)}
        <a href="#detalles" data-ir="op">${Number(p.rating || 0).toFixed(1)} · ${p.reviews || 0} opiniones</a>
      </div>
      ${chipsFicha.length ? `<ul class="pdp-chips" aria-label="Características">
        ${chipsFicha.map((c) => `<li class="spec-chip">${A.escape(c)}</li>`).join("")}
      </ul>` : ""}
    </div>

    <p class="lead">${A.escape(p.resumen)}</p>

    <div class="price-card">
      <div>
        <div class="pdp-price">
          <span class="price-now" id="precioUnit">${A.fmtUSD(p.precio)}</span>
          <span class="muted small">c/u</span>
          ${p.precioAnterior ? `<span class="price-old" style="font-size:1rem"><span class="sr-only">antes </span>${A.fmtUSD(p.precioAnterior)}</span>` : ""}
          <span class="badge badge-green">−5 % pagando en Bs</span>
        </div>
        <div class="small muted" id="precioBs" style="margin-top:6px">${A.fmtBs(p.precio)} a la tasa de hoy · IVA no incluido</div>
      </div>
      ${escalones.length ? `
      <div>
        <div class="buy-label"><span>Precio por cantidad</span><small>Suma todas las tallas y colores</small></div>
        <table class="tiers" id="tablaMayor"><tbody></tbody></table>
      </div>` : ""}
    </div>

    <div class="stock-line">
      <span class="dot ${est.cls}"></span>
      <span class="muted">${est.txt}</span>
    </div>

    <div class="buy-box" id="comprar">
      ${colores.length > 1 && !esPrenda ? `
      <div>
        <div class="buy-label"><span>Color base</span><small id="colorNombre">${A.escape(S.color)}</small></div>
        ${swatchesHTML}
      </div>` : ""}

      ${tieneTallas ? `
      <div>
        <div class="buy-label"><span>${pasoCant ? pasoCant + " · " : ""}Cantidad por talla</span><small>${bajoPedido ? "Se produce bajo pedido" : "Stock disponible por talla"}</small></div>
        <div class="sizes" id="tallas">
          ${p.tallas.map((t) => {
            const max = maxDe(t);
            const out = max <= 0;
            const stockTxt = bajoPedido ? "&nbsp;" : out ? "Agotada" : `quedan ${max}`;
            return `<div class="size${out ? " is-out" : ""}" data-talla="${A.escape(t)}">
              <span class="size-name">${A.escape(t)}</span>
              <div class="qty">
                <button type="button" data-d="-1" aria-label="Menos talla ${A.escape(t)}" ${out ? "disabled" : ""}>−</button>
                <input type="number" inputmode="numeric" min="0" max="${bajoPedido ? 999 : max}" value="0" aria-label="Cantidad talla ${A.escape(t)}" ${out ? "disabled" : ""}>
                <button type="button" data-d="1" aria-label="Más talla ${A.escape(t)}" ${out ? "disabled" : ""}>+</button>
              </div>
              <span class="size-stock${!bajoPedido && max > 0 && max <= 5 ? " is-low" : ""}">${stockTxt}</span>
            </div>`;
          }).join("")}
        </div>
      </div>` : `
      <div>
        <div class="buy-label"><span>${pasoCant ? pasoCant + " · " : ""}Cantidad</span><small>${bajoPedido ? "Se produce bajo pedido" : `${maxDe("_")} disponibles`}</small></div>
        <div class="qty" id="qtyUnica" style="height:46px">
          <button type="button" data-d="-1" style="width:40px;height:44px" aria-label="Restar">−</button>
          <input type="number" inputmode="numeric" min="0" max="${bajoPedido ? 999 : maxDe("_")}" value="${Math.min(S.cant._, maxDe("_"))}" aria-label="Cantidad" style="width:56px">
          <button type="button" data-d="1" style="width:40px;height:44px" aria-label="Sumar">+</button>
        </div>
      </div>`}

      ${esPrenda ? `
      <div class="field">
        <label for="disenoNota">Indicaciones <span class="muted" style="font-weight:500">(opcional)</span></label>
        <textarea class="textarea" id="disenoNota" maxlength="1000" style="min-height:70px" placeholder="${
          p.categoria === "deportiva" ? "Lista de nombres y números por talla, colores del escudo…"
          : p.categoria === "ninos" ? "Nombre y edad del cumpleañero para la espalda…"
          : tieneTallas ? "Texto debajo del logo, nombres por talla, lo que debamos saber…"
          : "Una frase, un nombre o lo que debamos saber de tu diseño…"}"></textarea>
        <span class="field-hint">${colores.length === 1 ? `Todas las piezas son color ${A.escape(colores[0].nombre.toLowerCase())}. ` : ""}Tu logo se imprime a todo color.</span>
      </div>` : p.permiteDiseno ? `
      <div class="design-box">
        <div class="buy-label" style="margin:0"><span>Tu diseño <span class="muted" style="font-weight:500">(opcional)</span></span><small>Te enviamos la prueba por WhatsApp</small></div>
        <div id="disenoArchivo"></div>
        <div class="field">
          <label for="disenoNota">Nota para el diseño</label>
          <textarea class="textarea" id="disenoNota" maxlength="1000" style="min-height:76px" placeholder="${
            p.categoria === "deportiva" ? "Colores del equipo, escudo, y la lista de nombres, números y tallas…"
            : p.categoria === "ninos" ? "Personaje, nombre y edad del cumpleañero…"
            : p.categoria === "chemises" ? "Logo al pecho izquierdo y grande en la espalda…"
            : "Qué quieres que lleve: texto, colores, ubicación…"}"></textarea>
          <span class="field-hint">Si no tienes el archivo a mano, déjalo en blanco: lo recibimos luego por WhatsApp.</span>
        </div>
      </div>` : ""}

      <div class="buy-sum" id="resumenCompra" aria-live="polite"></div>

      <div class="pdp-buy">
        <button class="btn btn-primary btn-lg grow" id="btnAdd" type="button">${A.icon("cart")} Agregar al carrito</button>
        <button class="icon-btn icon-btn--outline" id="btnFav" type="button" aria-label="Guardar en favoritos" aria-pressed="false">
          ${A.icon("heart")}
        </button>
      </div>
      <button class="btn btn-dark btn-lg btn-block" id="btnBuyNow" type="button">${A.icon("bolt")} Comprar ahora</button>
      ${A.waURL() ? `<a class="btn btn-wa btn-block" id="btnWhatsApp" target="_blank" rel="noopener" href="${A.waURL(`Hola Estampy, tengo una pregunta sobre *${p.nombre}*.`)}">${A.icon("whatsapp")} Preguntar por WhatsApp</a>` : ""}
    </div>

    <div class="info-grid">
      <div class="info-cell">
        <dt>Producción</dt>
        <dd style="font-size:.88rem;font-weight:500">${diasProd ? `${A.diasTxt(diasProd)} después de aprobar el diseño` : "Inmediata"}</dd>
      </div>
      <div class="info-cell">
        <dt>Llega en</dt>
        <dd style="font-size:.88rem;font-weight:500">${diasProd + envMin === diasProd + envMax ? A.diasTxt(diasProd + envMin) : `${diasProd + envMin} a ${diasProd + envMax} días hábiles`} con delivery, o ${diasProd ? A.diasTxt(diasProd) : "de inmediato"} si retiras en el taller</dd>
      </div>
      ${pedMin > 1 ? `<div class="info-cell"><dt>Pedido mínimo</dt><dd style="font-size:.88rem;font-weight:500">${pedMin} unidades de este producto</dd></div>` : ""}
    </div>

    ${(p.destacados || []).length ? `<div>
      <h3 style="font-size:.98rem;margin-bottom:12px">Por qué te va a gustar</h3>
      <ul class="feature-list">
        ${p.destacados.map((d) => `<li>${A.icon("check", "no-shrink")}<span>${A.escape(d)}</span></li>`).join("")}
      </ul>
    </div>` : ""}
  </div>`;

  /* ---------------- Galería ---------------- */
  const main = $("galleryMain");
  const thumbs = $("galleryThumbs");
  if (thumbs) thumbs.addEventListener("click", (e) => {
    const b = e.target.closest(".gallery-thumb");
    if (!b) return;
    main.style.opacity = "0";
    setTimeout(() => { main.src = b.dataset.src; main.style.opacity = "1"; }, 130);
    thumbs.querySelectorAll(".gallery-thumb").forEach((t) => t.classList.toggle("is-active", t === b));
  });

  /* ---------------- Color ---------------- */
  const sw = $("swatches");
  if (sw) sw.addEventListener("click", (e) => {
    const b = e.target.closest(".swatch");
    if (!b) return;
    S.color = b.dataset.color;
    sw.querySelectorAll(".swatch").forEach((x) => {
      x.classList.toggle("is-active", x === b);
      x.setAttribute("aria-checked", x === b);
    });
    $("colorNombre").textContent = S.color;
    // El simulador pinta la pieza del color elegido
    const hex = A.hexColor(p, S.color);
    if (hex && editor && typeof editor.ponerColor === "function") editor.ponerColor(hex);
  });

  /* ---------------- Cantidades ---------------- */
  function fijar(t, n, input) {
    const max = bajoPedido ? 999 : maxDe(t);
    let v = Math.max(0, Math.min(Math.floor(Number(n) || 0), max));
    if (!bajoPedido && Number(n) > max) A.toast(max ? `Solo quedan ${max}${t !== "_" ? " en talla " + t : ""}` : "No quedan unidades disponibles", "alert");
    S.cant[t] = v;
    if (input) input.value = v;
    const cell = input && input.closest(".size");
    if (cell) cell.classList.toggle("has-qty", v > 0);
    pintarResumen();
  }

  function enlazarQty(cont, tallaDe) {
    if (!cont) return;
    cont.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-d]");
      if (!b) return;
      const box = b.closest(".qty");
      const input = box.querySelector("input");
      fijar(tallaDe(b), (Number(input.value) || 0) + Number(b.dataset.d), input);
    });
    cont.addEventListener("change", (e) => {
      if (e.target.tagName === "INPUT") fijar(tallaDe(e.target), e.target.value, e.target);
    });
    // Mientras escribe: actualiza el resumen sin reescribir el campo (el tope se aplica al salir)
    cont.addEventListener("input", (e) => {
      if (e.target.tagName !== "INPUT" || e.target.value === "") return;
      const t = tallaDe(e.target);
      const max = bajoPedido ? 999 : maxDe(t);
      S.cant[t] = Math.max(0, Math.min(Math.floor(Number(e.target.value) || 0), max));
      const cell = e.target.closest(".size");
      if (cell) cell.classList.toggle("has-qty", S.cant[t] > 0);
      pintarResumen();
    });
    cont.addEventListener("focusin", (e) => { if (e.target.tagName === "INPUT") e.target.select(); });
  }
  enlazarQty($("tallas"), (el) => el.closest(".size").dataset.talla);
  enlazarQty($("qtyUnica"), () => "_");
  if (!tieneTallas) S.cant._ = Math.min(S.cant._, bajoPedido ? 999 : maxDe("_"));

  /* ---------------- Resumen: unidades, precio con escalón, avisos ---------------- */
  function pintarResumen() {
    const sel = totalSel();
    const yaEnCarrito = A.cart.enCarrito(p.id);
    const total = sel + yaEnCarrito;
    const unit = A.precioUnitario(p, Math.max(total, 1));
    const sig = escalones.find((e) => e.desde > total);
    const falta = sig ? sig.desde - total : 0;

    $("precioUnit").textContent = A.fmtUSD(unit);
    $("precioBs").textContent = `${A.fmtBs(unit)} c/u a la tasa de hoy · IVA no incluido`;

    const tb = document.querySelector("#tablaMayor tbody");
    if (tb) {
      const filas = [{ desde: 1, precio: Number(p.precio) }].concat(escalones);
      tb.innerHTML = filas.map((x, i) => {
        const hasta = filas[i + 1] ? filas[i + 1].desde - 1 : null;
        const on = total >= x.desde && (!hasta || total <= hasta) || (total === 0 && i === 0);
        return `<tr class="${on ? "is-on" : ""}"><td>${hasta ? `${x.desde} a ${hasta}` : `${x.desde} o más`} unidades</td><td>${A.fmtUSD(x.precio)} c/u</td></tr>`;
      }).join("");
    }

    const lineas = [];
    lineas.push(`<div class="row-between"><span>Unidades${yaEnCarrito ? ` (+${yaEnCarrito} en tu carrito)` : ""}</span><span>${sel}</span></div>`);
    lineas.push(`<div class="row-between"><span>Precio por unidad</span><span>${A.fmtUSD(unit)}${unit < p.precio ? ` <span class="badge badge-yellow">Al mayor</span>` : ""}</span></div>`);
    lineas.push(`<div class="row-between" style="font-size:1rem"><span><strong>Subtotal</strong></span><span>${A.fmtUSD(A.round2(unit * sel))}</span></div>`);
    if (sig && total > 0) lineas.push(`<div class="buy-hint">${falta === 1 ? "Te falta" : "Te faltan"} <strong>${falta}</strong> ${falta === 1 ? "unidad" : "unidades"} para pagar <strong>${A.fmtUSD(sig.precio)}</strong> c/u.</div>`);
    else if (sig) lineas.push(`<div class="buy-hint">Desde ${sig.desde} unidades pagas ${A.fmtUSD(sig.precio)} c/u.</div>`);
    if (pedMin > 1 && total < pedMin) lineas.push(`<div class="notice notice-amber" style="padding:9px 11px">${A.icon("alert")}<span>Pedido mínimo: <strong>${pedMin} unidades</strong>. ${total ? `Te faltan ${pedMin - total}.` : ""}</span></div>`);
    $("resumenCompra").innerHTML = lineas.join("");

    const bloqueado = sel <= 0 || S.subiendo || est.agotado;
    $("btnAdd").disabled = bloqueado;
    $("btnBuyNow").disabled = bloqueado;
    $("btnAdd").title = S.subiendo ? "Espera a que termine de subir tu archivo" : sel <= 0 ? (tieneTallas ? "Indica cuántas quieres de cada talla" : "Indica la cantidad") : "";
  }

  /* ---------------- Diseño: archivo + nota ---------------- */
  const TIPOS = { "image/png": "PNG", "image/jpeg": "JPG", "image/webp": "WEBP", "application/pdf": "PDF" };
  const EXT = /\.(png|jpe?g|webp|pdf)$/i;

  function pintarArchivo() {
    const box = $("disenoArchivo");
    if (!box) return;
    if (S.subiendo) {
      box.innerHTML = `<div class="file-chip">${A.icon("upload")}<span class="grow">Subiendo <strong>${A.escape(S.archivo.nombre)}</strong>…</span></div>
        <div class="progress" style="margin-top:8px" role="progressbar" aria-label="Subiendo archivo"></div>`;
      return;
    }
    if (S.archivo) {
      box.innerHTML = `<div class="file-chip">${A.icon(S.archivo.url ? "checkCircle" : "info")}
          <span class="grow" title="${A.escape(S.archivo.nombre)}">${A.escape(S.archivo.nombre)}</span>
          <button class="cart-remove" type="button" id="quitarArchivo">Quitar</button></div>
        ${S.avisoArchivo ? `<div class="notice notice-amber" style="margin-top:8px">${A.icon("whatsapp")}<span>${S.avisoArchivo}</span></div>` : ""}`;
      $("quitarArchivo").onclick = () => {
        S.archivo = null; S.avisoArchivo = ""; S.errorArchivo = "";
        if (esPrenda) quitarLogo();
        pintarArchivo(); pintarResumen();
      };
      return;
    }
    box.innerHTML = `
      <label class="drop" id="drop">
        <input type="file" id="disenoFile" accept=".png,.jpg,.jpeg,.webp,.pdf,image/png,image/jpeg,image/webp,application/pdf">
        <span class="drop-ic">${A.icon("upload")}</span>
        <span><strong>Sube tu logo, foto o arte</strong><span>${A.escape(formatos)} · hasta ${maxMB} MB</span></span>
      </label>
      ${S.errorArchivo ? `<div class="field-error is-shown" style="margin-top:6px">${S.errorArchivo}</div>` : ""}`;
    const input = $("disenoFile");
    input.onchange = () => input.files[0] && elegirArchivo(input.files[0]);
    const drop = $("drop");
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("is-over"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("is-over"); }));
    drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) elegirArchivo(f); });
  }

  async function elegirArchivo(f) {
    S.errorArchivo = "";
    S.avisoArchivo = "";
    if (!TIPOS[f.type] && !EXT.test(f.name)) {
      S.errorArchivo = `Ese formato no nos sirve. Usa ${A.escape(formatos)}.`;
      return pintarArchivo();
    }
    if (f.size > maxMB * 1024 * 1024) {
      S.errorArchivo = `El archivo pesa ${(f.size / 1048576).toFixed(1)} MB y el máximo es ${maxMB} MB. Mándalo por WhatsApp o redúcelo.`;
      return pintarArchivo();
    }
    S.archivo = { nombre: f.name };
    if (esPrenda) {
      const lg = await prepararLogo(f);
      quitarLogo();
      S.logo = lg;
      S.preview = lg.preview || "";
      S.logoPorWhatsApp = false;
      const wa = $("logoWA");
      if (wa) wa.checked = false;
      $("logoUpload").classList.remove("is-missing");
      if (editor) editor.ponerLogo(lg);
    }
    const puedeSubir = A.modoServidor && A.api && typeof A.api.subirDiseno === "function";
    if (!puedeSubir) {
      S.avisoArchivo = "Ahora no podemos recibir archivos en la web. Guardamos el nombre en tu pedido: envíanos el archivo por WhatsApp cuando te contactemos.";
      pintarArchivo();
      return pintarResumen();
    }
    S.subiendo = true;
    pintarArchivo(); pintarResumen();
    try {
      const r = await A.api.subirDiseno(f);
      S.archivo = { url: r.url, ruta: r.ruta, nombre: r.nombre || f.name };
      A.toast("Diseño recibido", "checkCircle");
    } catch (e) {
      S.archivo = { nombre: f.name };
      S.avisoArchivo = `No pudimos subir el archivo${e && e.message ? " (" + A.escape(e.message) + ")" : ""}. Puedes intentar otra vez o seguir: guardamos el nombre y nos lo envías por WhatsApp.`;
    } finally {
      S.subiendo = false;
      pintarArchivo(); pintarResumen();
    }
  }
  /* ---------------- Prendas: logo en el simulador ---------------- */
  /** Lee la imagen del logo: proporción y una vista previa pequeña para el carrito. */
  function prepararLogo(f) {
    const esPDF = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    if (esPDF) return Promise.resolve({ tipo: "pdf", ratio: 1, src: "", preview: "" });
    return new Promise((resolve) => {
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        const w = img.naturalWidth || 1, h = img.naturalHeight || 1;
        let preview = "";
        try {
          const k = Math.min(1, 360 / Math.max(w, h));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(w * k));
          c.height = Math.max(1, Math.round(h * k));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          preview = c.toDataURL("image/webp", 0.86);
          if (preview.indexOf("data:image/webp") !== 0) preview = c.toDataURL("image/png");
        } catch (e) { preview = ""; }
        resolve({ tipo: "img", src: url, ratio: h / w, preview });
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve({ tipo: "marcador", ratio: 1, src: "", preview: "" }); };
      img.src = url;
    });
  }
  function quitarLogo() {
    if (S.logo && S.logo.src && S.logo.src.indexOf("blob:") === 0) URL.revokeObjectURL(S.logo.src);
    S.logo = null;
    S.preview = "";
    if (editor) editor.ponerLogo(null);
  }

  const editor = esPrenda ? A.mockup.editor($("mkEditor"), { producto: p, alCambiar: () => pintarResumen() }) : null;
  if (esPrenda) {
    $("logoWA").addEventListener("change", (e) => {
      S.logoPorWhatsApp = e.target.checked;
      if (e.target.checked) $("logoUpload").classList.remove("is-missing");
    });
  }

  pintarArchivo();

  /* ---------------- Agregar al carrito ---------------- */
  function agregar() {
    if (S.subiendo) { A.toast("Espera a que termine de subir tu archivo", "alert"); return 0; }
    const cant = {};
    Object.keys(S.cant).forEach((t) => { if (S.cant[t] > 0) cant[t] = S.cant[t]; });
    if (!Object.keys(cant).length) { A.toast(tieneTallas ? "Indica cuántas quieres de cada talla" : "Indica la cantidad", "alert"); return 0; }
    const notaEl = $("disenoNota");
    const nota = notaEl ? notaEl.value.trim() : "";
    let diseno = null;
    if (esPrenda) {
      const ubicaciones = editor ? editor.ubicaciones() : [];
      const irEditor = () => $("editorLogo").scrollIntoView({ behavior: "smooth", block: "start" });
      if (!ubicaciones.length) { A.toast("Elige en el simulador dónde va tu logo", "alert"); irEditor(); return 0; }
      if (!S.archivo && !S.logoPorWhatsApp) {
        A.toast("Sube tu logo o marca que nos lo envías por WhatsApp", "alert");
        $("logoUpload").classList.add("is-missing");
        irEditor();
        return 0;
      }
      const hexSeleccionado = A.hexColor(p, S.color);
      diseno = {
        nota,
        archivo: S.archivo,
        ubicaciones,
        prenda: hexSeleccionado ? { ...A.mockup.instantanea(p), color: hexSeleccionado } : A.mockup.instantanea(p),
        logoPorWhatsApp: !S.archivo && S.logoPorWhatsApp,
        preview: S.preview,
      };
    } else {
      diseno = p.permiteDiseno && (nota || S.archivo) ? { nota, archivo: S.archivo } : null;
    }
    const n = A.cart.agregar(p.id, cant, { color: S.color, diseno });
    if (n) {
      // Deja el panel listo para otras tallas. En prendas se conservan el logo y
      // su ubicación (lo normal es pedir varias tallas con el mismo logo).
      Object.keys(S.cant).forEach((t) => (S.cant[t] = 0));
      document.querySelectorAll("#tallas input, #qtyUnica input").forEach((i) => { i.value = 0; const c = i.closest(".size"); if (c) c.classList.remove("has-qty"); });
      if (!esPrenda) {
        if (notaEl) notaEl.value = "";
        S.archivo = null; S.avisoArchivo = "";
        pintarArchivo();
      }
      refrescarStock(); pintarResumen();
    }
    return n;
  }

  /* Tras agregar, el stock libre por talla cambia (lo que ya está en el carrito) */
  function refrescarStock() {
    if (bajoPedido) return;
    document.querySelectorAll("#tallas .size").forEach((c) => {
      const max = maxDe(c.dataset.talla);
      const out = max <= 0;
      c.classList.toggle("is-out", out);
      c.querySelectorAll("input, button").forEach((x) => (x.disabled = out));
      c.querySelector("input").max = max;
      const s = c.querySelector(".size-stock");
      s.textContent = out ? "Agotada" : `quedan ${max}`;
      s.classList.toggle("is-low", !out && max <= 5);
    });
    const u = document.querySelector("#qtyUnica input");
    if (u) u.max = maxDe("_");
  }

  $("btnAdd").onclick = () => { if (agregar()) A.openCart(); };
  $("btnBuyNow").onclick = () => {
    if (!agregar()) return;
    if (A.cart.faltaMinimo().length) { A.openCart(); return; }
    location.href = "checkout.html";
  };

  const fav = $("btnFav");
  const pintarFav = (on) => { fav.style.color = on ? "var(--brand)" : ""; fav.setAttribute("aria-pressed", on); fav.querySelector("svg").style.fill = on ? "currentColor" : "none"; };
  pintarFav(A.favs.has(p.id));
  fav.onclick = () => {
    const on = A.favs.toggle(p.id);
    pintarFav(on);
    A.toast(on ? "Guardado en favoritos" : "Quitado de favoritos", "heart");
  };

  pintarResumen();
  document.addEventListener("stampy:cart", () => { refrescarStock(); pintarResumen(); });

  /* ---------------- Pestañas ---------------- */
  const opiniones = Array.isArray(p.opiniones) ? p.opiniones : [];
  const TABS = [
    { id: "desc", label: "Descripción" },
    { id: "specs", label: "Ficha técnica" },
    { id: "envio", label: "Tiempos y envío" },
    { id: "op", label: `Opiniones (${opiniones.length})` },
  ];

  $("tabs").innerHTML = TABS
    .map((t, i) => `<button class="tab${i === 0 ? " is-active" : ""}" data-tab="${t.id}" type="button" role="tab" aria-selected="${i === 0}">${t.label}</button>`)
    .join("");

  const prom = opiniones.length
    ? opiniones.reduce((s, o) => s + (Number(o.estrellas) || 0), 0) / opiniones.length
    : Number(p.rating) || 0;

  const specs = Object.entries(p.specs || {});
  const zonasFilas = zonas.map((z) => `<div class="specs-row" style="grid-template-columns:1fr auto">
      <dt style="color:var(--gray-700)">${A.escape(z.nombre)}</dt>
      <dd style="text-align:right">${A.fmtUSD(z.costo)} · ${A.diasTxt(diasProd + z.dias)}</dd>
    </div>`).join("");

  $("tabPanels").innerHTML = `
    <div class="tab-panel is-active" data-panel="desc" role="tabpanel">
      <div style="max-width:76ch" class="stack-16">
        <p style="font-size:1.02rem;color:var(--ink-soft);line-height:1.75">${A.escape(p.descripcion)}</p>
        <div class="grid-2" style="gap:22px">
          <div class="panel" style="padding:22px">
            <h3 style="font-size:.96rem;margin-bottom:12px">Cómo lo hacemos</h3>
            <ul class="feature-list">
              <li>${A.icon("upload", "no-shrink")}<span>${esPrenda ? "Subes tu logo y marcas en el simulador dónde va y de qué tamaño (o nos lo mandas por WhatsApp)." : "Recibimos tu archivo o tu idea con el pedido (o luego por WhatsApp)."}</span></li>
              <li>${A.icon("whatsapp", "no-shrink")}<span>Te enviamos la prueba de diseño y ajustamos lo que haga falta hasta que la apruebes.</span></li>
              <li>${A.icon("print", "no-shrink")}<span>Imprimimos y sublimamos ${diasProd ? `en ${A.diasTxt(diasProd)}` : "de inmediato"}.</span></li>
              <li>${A.icon("truck", "no-shrink")}<span>Despachamos a tu zona o te avisamos para retirar en el taller.</span></li>
            </ul>
          </div>
          <div class="panel" style="padding:22px">
            <h3 style="font-size:.96rem;margin-bottom:12px">Para que tu archivo quede perfecto</h3>
            <ul class="feature-list">
              <li>${A.icon("check", "no-shrink")}<span>${A.escape(formatos)}, hasta ${maxMB} MB.</span></li>
              <li>${A.icon("check", "no-shrink")}<span>Mientras más resolución, mejor. Un logo en PDF o PNG con fondo transparente es ideal.</span></li>
              <li>${A.icon("check", "no-shrink")}<span>¿Solo tienes una foto del logo? Mándala igual: la revisamos y te decimos si hace falta redibujarlo.</span></li>
              ${p.specs && p.specs["Área de impresión"] ? `<li>${A.icon("check", "no-shrink")}<span>Área de impresión: ${A.escape(p.specs["Área de impresión"])}.</span></li>` : ""}
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" data-panel="specs" role="tabpanel">
      <dl class="specs-table" style="max-width:820px">
        ${specs.map(([k, v]) => `<div class="specs-row"><dt>${A.escape(k)}</dt><dd>${A.escape(v)}</dd></div>`).join("")}
        ${tieneTallas ? `<div class="specs-row"><dt>Tallas</dt><dd>${p.tallas.map(A.escape).join(" · ")}</dd></div>` : ""}
        ${esPrenda ? `<div class="specs-row"><dt>Dónde va tu logo</dt><dd>${A.mockup.vistasDe(p).map((v) => {
          const a = A.mockup.areaCm(p, v);
          return `${A.escape(nombreZona(v))} (${String(a.ancho).replace(".", ",")} × ${String(a.alto).replace(".", ",")} cm)`;
        }).join(" · ")}</dd></div>` : ""}
        ${colores.length ? `<div class="specs-row"><dt>${colores.length > 1 ? "Colores base" : "Color base"}</dt><dd>${colores.map((c) => A.escape(c.nombre)).join(" · ")}</dd></div>` : ""}
        <div class="specs-row"><dt>Disponibilidad</dt><dd>${bajoPedido ? "Se produce bajo pedido" : "Piezas listas en taller"}</dd></div>
        ${pedMin > 1 ? `<div class="specs-row"><dt>Pedido mínimo</dt><dd>${pedMin} unidades</dd></div>` : ""}
      </dl>
    </div>

    <div class="tab-panel" data-panel="envio" role="tabpanel">
      <div class="grid-2" style="gap:22px;align-items:start;max-width:920px">
        <div class="panel" style="padding:22px">
          <h3 style="font-size:.96rem;margin-bottom:6px">Delivery: costo y tiempo total</h3>
          <p class="small muted" style="margin-bottom:14px">Incluye ${diasProd ? A.diasTxt(diasProd) + " de producción" : "la preparación"} más el envío a tu zona.</p>
          <dl class="specs-table">${zonasFilas}</dl>
          <div class="notice notice-green" style="margin-top:14px">
            ${A.icon("truck")}<span>Delivery gratis en pedidos sobre ${A.fmtUSD(CFG.freeShippingOver)}.</span>
          </div>
        </div>
        <div class="panel" style="padding:22px">
          <h3 style="font-size:.96rem;margin-bottom:14px">Retiro y cambios</h3>
          <ul class="feature-list">
            <li>${A.icon("store", "no-shrink")}<span>Retiro sin costo en ${A.escape(((CFG.tiendas || [])[0] || {}).nombre || "el taller")}. Te avisamos por WhatsApp cuando esté listo.</span></li>
            <li>${A.icon("shield", "no-shrink")}<span>Si la pieza llega con un defecto de impresión o de costura, la reponemos sin costo.</span></li>
            <li>${A.icon("info", "no-shrink")}<span>Como cada pieza se hace con tu diseño, no aceptamos cambios por gusto una vez aprobada la prueba. Revisa bien tallas y textos.</span></li>
            ${p.specs && p.specs.Cuidado ? `<li>${A.icon("refresh", "no-shrink")}<span>Cuidado: ${A.escape(p.specs.Cuidado)}.</span></li>` : ""}
          </ul>
        </div>
      </div>
    </div>

    <div class="tab-panel" data-panel="op" role="tabpanel">
      <div style="max-width:760px">
        <div class="row" style="gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap">
          <div style="text-align:center">
            <div style="font-family:var(--font-display);font-size:2.4rem;font-weight:400;color:var(--ink);line-height:1">${prom.toFixed(1)}</div>
            ${A.stars(prom)}
            <div class="tiny muted" style="margin-top:4px">${p.reviews || 0} valoraciones</div>
          </div>
          ${opiniones.length ? `<div class="grow stack-4" style="min-width:220px">
            ${[5, 4, 3, 2, 1].map((n) => {
              const c = opiniones.filter((o) => Number(o.estrellas) === n).length;
              const pct = Math.round((c / opiniones.length) * 100);
              return `<div class="row" style="gap:9px">
                <span class="tiny muted" style="width:18px">${n}★</span>
                <span class="rating-bar"><span style="width:${pct}%"></span></span>
                <span class="tiny muted" style="width:34px;text-align:right">${pct}%</span>
              </div>`;
            }).join("")}
          </div>` : ""}
        </div>
        ${opiniones.length ? opiniones.map((o) => `
          <div class="review">
            <div class="row" style="align-items:flex-start;gap:13px">
              <span class="avatar">${A.escape(String(o.autor || "?").slice(0, 1))}</span>
              <div class="grow">
                <div class="row-between" style="align-items:flex-start">
                  <div>
                    <strong style="font-size:.93rem;color:var(--brand-deep)">${A.escape(o.autor)}</strong>
                    <div class="row" style="gap:8px;margin-top:2px">${A.stars(o.estrellas)}</div>
                  </div>
                  <span class="tiny muted">${A.escape(o.fecha)}</span>
                </div>
                <p class="small" style="margin-top:9px;color:var(--ink-soft)">${A.escape(o.texto)}</p>
              </div>
            </div>
          </div>`).join("")
        : `<p class="small muted" style="padding:20px 0">Todavía no hay opiniones escritas de este producto. ¿Ya lo pediste? Cuéntanos qué tal te fue por Instagram o WhatsApp.</p>`}
      </div>
    </div>`;

  function irTab(tabId) {
    document.querySelectorAll(".tab").forEach((t) => { const on = t.dataset.tab === tabId; t.classList.toggle("is-active", on); t.setAttribute("aria-selected", on); });
    document.querySelectorAll(".tab-panel").forEach((pn) => pn.classList.toggle("is-active", pn.dataset.panel === tabId));
  }
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) irTab(b.dataset.tab); });
  document.querySelector("[data-ir]").addEventListener("click", () => irTab("op"));

  /* ---------------- Relacionados ---------------- */
  const rel = A.products
    .filter((x) => x.id !== p.id && x.activo !== false)
    .sort((a, b) => {
      const sa = (a.categoria === p.categoria ? 2 : 0) + (a.linea === p.linea ? 1 : 0) + (a.reviews || 0) / 1000;
      const sb = (b.categoria === p.categoria ? 2 : 0) + (b.linea === p.linea ? 1 : 0) + (b.reviews || 0) / 1000;
      return sb - sa;
    })
    .slice(0, 4);
  $("relacionados").innerHTML = rel.map(A.cardHTML).join("");

  if (location.hash === "#comprar") setTimeout(() => $("comprar").scrollIntoView({ behavior: "smooth", block: "start" }), 150);
})();
</script>
</body>
</html>
